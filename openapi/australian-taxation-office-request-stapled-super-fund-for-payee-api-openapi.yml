      - personDemographic
    StapledSuperFund:
      description: This holds the stapled super fund details.
      properties:
        requestOutcome:
          $ref: '#/components/schemas/StapledFundRequestOutcome'
        payee:
          properties:
            personName:
              properties:
                familyName:
                  example: Martin
                  description: The person's last name or surname. The name by which a family group is identified.
                  type: string
                givenName:
                  example: Mark
                  description: The name given to a person which is that person's identifying name within the family group or the name by which the person is uniquely socially identified; the name borne by an individual, often assigned by his or her parents shortly after birth, as opposed to the inherited surname.
                  type: string
                otherGivenName:
                  example: Matthew
                  description: The middle name given to a person which complements that person's identifying name within the family group or the name by which the person is uniquely socially identified.
                  type:
                  - string
                  - 'null'
            payeePayrollId:
              type: string
          type: object
        superfund:
          properties:
            australianBusinessNumber:
              description: A unique public identifier issued to all entities registered in the Australian Business Register (ABR), to be used in their dealings with government. Companies registered under the Corporations Law and business entities carrying on an enterprise in Australia are entitled to an ABN.
              example: 50110219460
              type: string
            organisationalName:
              description: The full name by which an organisation is known.
              type: string
            superannuationProduct:
              $ref: '#/components/schemas/SuperannuationProduct'
            superannuationFund:
              $ref: '#/components/schemas/SuperannuationFund'
          description: The information that gets populated for the stapled superfund response payload structure
          type: object
    SuperannuationProduct:
      properties:
        name:
          description: This is the name of the superannuation fund's product.
          type: string
      type:
      - object
      - 'null'
    Declaration:
      properties:
        statementAcceptedIndicator:
          description: Indicates that the terms stated in the Declaration Text have been accepted or declined.
          type: boolean
      description: This will hold the specific information relating to the declaration text for the stapled superfund request.
      type: object
      required:
      - statementAcceptedIndicator
  examples:
    NonSMSFStapledSuperFundResponse:
      summary: Non SMSF Stapled Super Fund response
      description: Example Non SMSF Stapled Super Fund response
      value: "{\n  \"data\":{\n    \"requestOutcome\": {\n      \"reasonCode\": \"Stapled fund\"\n    },\n    \"payee\": {\n      \"payeePayrollId\": \"123456789\",\n      \"personName\": {\n        \"familyName\": \"Doe\",\n        \"givenName\": \"John\",\n        \"otherGivenName\": \"Louis Rey\"\n      }\n    },\n    \"superfund\": {\n      \"australianBusinessNumber\": \"12345678901\",\n      \"organisationalName\": \"Australian Super Pty Ltd\",\n      \"superannuationProduct\": {\n        \"name\": \"Australian Super\"\n      },\n      \"superannuationFund\": {\n        \"uniqueSuperannuationIdentifier\": \"STA0100AU\",\n        \"memberAccount\": \"12345678901234\"\n      }\n    }\n    }\n}"
    SMSFStapledSuperFundResponse:
      summary: SMSF Stapled Super Fund response
      description: Example SMSF Stapled Super Fund response
      value: "{\n  \"data\": {\n    \"requestOutcome\": {\n      \"reasonCode\": \"Stapled SMSF\"\n    },\n    \"payee\": {\n      \"payeePayrollId\": \"123456789\",\n      \"personName\": {\n        \"familyName\": \"Doe\",\n        \"givenName\": \"John\",\n        \"otherGivenName\": \"Louis Rey\"\n      }\n    },\n    \"superfund\": {\n      \"australianBusinessNumber\": \"12345678901\",\n      \"organisationalName\": \"Australian Super Pty Ltd\",\n      \"superannuationProduct\": {\n        \"name\": \"\"\n      },\n      \"superannuationFund\": {\n        \"uniqueSuperannuationIdentifier\": \"\",\n        \"memberAccount\": \"\"\n      }\n    }\n  }\n}"
    InternalServerErrorResponse:
      summary: Internal Server Error response
      description: Example Internal Server Error response
      value: "{\n  \"errors\": [\n  {\n    \"code\": \"RSF.00003\",\n    \"detail\": \"Your request cannot be processed. Please try again later.  If the problem persists, please contact ATO\"\n  }\n  ]\n}"
    SchemaBadRequestResponse:
      summary: Schema Bad Request response
      description: Example Schema Bad Request response
      value: "{\n  \"errors\": [\n  {\n    \"code\": \"RSF.00000\",\n    \"detail\": \"regex '^[0-9]{4}$' does not match input string '12345'\",\n    \"source\": {\n      \"pointer\": \"/payee/addressResidential/postCode\"\n    }\n  }\n  ]\n}"
    TFNExemptionAddressResponse:
      summary: Exempt TFN Code Address response
      description: Example Exempt TFN Code Address response
      value: "{\n  \"errors\": [\n    {\n      \"code\": \"ADDR.00001\",\n      \"detail\": \"If an exempted TFN code is present, Payee residential address or Payee postal address must be provided.\"\n    }\n  ]\n}"
  parameters:
    contextParam:
      name: context
      required: false
      in: query
      description: "\nThe `context` parameter specifies the ABN of the intermediary, the Tax Agent Number (TAN),\nor Registered Agent Number(RAN)\n\n-\tWhen a payer is submitting request for its newly joined payee: context not required.\n-\tWhen an intermediary that is not an agent is acting on behalf of the payer requesting\n  stapled super fund of the newly joined payee:\n  `context=\"ABN={abn_intermediary}\";` note the intermediary does not have a TAN or a RAN as it is not an agent\n-\tWhen an agent is acting on behalf of the payer requesting stapled super fund of the newly joined payee,\n  TAN or RAN of the intermediary has to be provided in the context, e.g.: `context=\"TAN={TAN}\"` or `context=\"RAN={RAN}\"`.\n  \n"
      schema:
        type: string
      examples:
        tan:
          value: '"TAN=17801003"'
          summary: Tax agent – TAN
        ran:
          value: '"RAN=17801003"'
          summary: Tax agent – RAN
        abn_intermediary:
          value: '"ABN=18083973826"'
          summary: Intermediary that is not a tax agent
    umcParam:
      name: unableToMakeContribution
      required: false
      in: query
      description: "\nStapled super fund previously notified by the ATO cannot accept contributions. \nUse to indicate that employer is unable to make contributions to accounts previously notified in staple super fund request outcome.\n"
      schema:
        type: boolean
        example: true
  headers:
    ReceiptHeader:
      description: The receipt number for the super fund details interaction.
      schema:
        type: string
        pattern: '[0-9]{13}'
        example: 6300000000014
  securitySchemes:
    ScopeAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.evte.ato.gov.au/core2/connect/token
          scopes:
            ato.super.stapledsuperfund.c,r: Grants ability to POST and GET a Stapled Super Fund
