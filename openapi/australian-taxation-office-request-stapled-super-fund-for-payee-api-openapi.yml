      - 'null'
    StapledFundRequestOutcome:
      properties:
        reasonCode:
          enum:
          - Unmatched
          - Excluded client
          - Choice fund
          - Choice SMSF
          - Stapled fund
          - Stapled SMSF
          - Use default
          - No active payee/payer link
          example: Unmatched
          type: string
      type: object
    StapledSuperFundRequest:
      properties:
        payee:
          $ref: '#/components/schemas/Payee'
        declaration:
          $ref: '#/components/schemas/Declaration'
      description: The information needed for the stapled superfund request payload structure
      type: object
