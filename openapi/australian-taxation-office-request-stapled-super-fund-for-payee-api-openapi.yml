info:
  title: Australian Taxation Office Request Stapled Super Fund for…
  version: 1.1.28
  x-status:
    status: Proposed
  description: 'Operations tagged Request Stapled Super Fund for Payee across 2 of this provider''s published API definitions: stapled-super-fund-v1_16.yaml, australian-taxation-office-stapled-super-fund-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{env}/super/v1/clients/{identifierType}/{identifierValue}/payees/TFN/*/stapledSuperFund
  description: Devtest Environment
  variables:
    identifierType:
      default: ABN
      enum:
      - ABN
      - WPN
      description: Identifier Type
    env:
      default: sandbox.api.ato.gov.au
      enum:
      - api.ato.gov.au
      - sandbox.api.ato.gov.au
security:
- ScopeAuth:
  - ato.super.stapledsuperfund.c,r
tags:
- name: Request Stapled Super Fund for Payee
paths:
  /:
    post:
      tags:
      - Request Stapled Super Fund for Payee
      summary: Use this endpoint to make a request for the stapled superannuation fund of a…
      description: 'You can use this endpoint to make a request for the stapled superannuation fund of a newly joined payee using the

        payer ABN. We can process the request faster if you provide the payee TFN and will respond back with the outcome near real-time.

        However, if you provide us an exempted TFN code, we will need more time to process the request.

        The response header section will contain a receipt number.

        You will have to make another call using the

        "Get Payee Stapled Super Fund for Receipt"

        to get the outcome using the receipt number.


        Following are the exempted TFN codes:


        - `000000000`: Use this when the employee chose not to quote a TFN and has not claimed an exemption from quoting a TFN or does not fit any of the below categories

        - `111111111`: Use this when the employee has applied for a TFN but hasn''t received it yet

        - `333333333`: Use this when the employee is under 18 years old, with no TFN, and earns less than the amount required to attract pay as you go (PAYG) withholding

        - `444444444`: Use this when the employee is a recipient of social security, or a service pension or benefit'
      parameters:
      - $ref: '#/components/parameters/contextParam'
      - $ref: '#/components/parameters/umcParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StapledSuperFundRequest'
        description: Request stapled super fund details.
        required: true
      operationId: requestStapledSuperFundForPayeeWithAbn
      responses:
        '400':
          content:
            application/json:
              examples:
                BadRequestExample:
                  $ref: '#/components/examples/SchemaBadRequestResponse'
              schema:
                $ref: '#/components/schemas/ApiErrorsResponse'
          description: Bad Request
          headers:
            receipt:
              $ref: '#/components/headers/ReceiptHeader'
        '422':
          content:
            application/json:
              examples:
                TFNExemptionAddressResponseExample:
                  $ref: '#/components/examples/TFNExemptionAddressResponse'
              schema:
                $ref: '#/components/schemas/ApiErrorsResponse'
          description: UnprocessableEntity
          headers:
            receipt:
              $ref: '#/components/headers/ReceiptHeader'
        '200':
          content:
            application/json:
              examples:
                SMSFStapledSuperFundResponseExample:
                  $ref: '#/components/examples/SMSFStapledSuperFundResponse'
                NonSMSFStapledSuperFundResponseExample:
                  $ref: '#/components/examples/NonSMSFStapledSuperFundResponse'
              schema:
                $ref: '#/components/schemas/StapledSuperFundResponse'
          description: "OK. \n\nThe request was successfully processed.\n"
          headers:
            receipt:
              $ref: '#/components/headers/ReceiptHeader'
        '500':
          content:
            application/json:
              examples:
                InternalServerErrorExample:
                  $ref: '#/components/examples/InternalServerErrorResponse'
              schema:
                $ref: '#/components/schemas/ApiErrorsResponse'
          description: Internal Server Error
          headers:
            receipt:
              $ref: '#/components/headers/ReceiptHeader'
    servers:
    - url: https://{env}/super/v1/clients/{identifierType}/{identifierValue}/payees/TFN/*/stapledSuperFund
      description: Devtest Environment
      variables:
        identifierType:
          default: ABN
          enum:
          - ABN
          - WPN
          description: Identifier Type
        env:
          default: sandbox.api.ato.gov.au
          enum:
          - api.ato.gov.au
          - sandbox.api.ato.gov.au
