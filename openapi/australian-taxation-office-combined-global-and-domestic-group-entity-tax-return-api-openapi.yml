openapi: 3.2.0
info:
  title: Australian Taxation Office Combined Global and Domestic…
  version: 1.1.60
  x-status:
    status: Proposed
  description: 'Operations tagged Combined Global and Domestic Group Entity Tax Return across 2 of this provider''s published API definitions: dsg-global-domestic-minimum-return-child-v1_9.yaml, australian-taxation-office-global-domestic-minimum-group-entity-tax-return-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{env}/combinedMinimumGlobalDomesticReturn/v1
  description: 'Global and Domestic Minimum Group Entity Tax Return

    '
  variables:
    env:
      default: api.ato.gov.au
      description: 'This is the environment that is going to be used to hit the API

        '
      enum:
      - sandbox.api.ato.gov.au
      - api.ato.gov.au
tags:
- name: Combined Global and Domestic Group Entity Tax Return
paths:
  /clients/ABN/{identifierValue}/globalDomesticReturn/{transactionID}/groupEntity:
    post:
      tags:
      - Combined Global and Domestic Group Entity Tax Return
      summary: This endpoint will allow you to either lodge or amend a Combined Global and…
      description: 'This API is to support the digital lodgement of tax returns for group entities that are subject to Australia''s implementation of the OECD''s Global Anti-Base

        Erosion (GloBE) rules. It facilitates the reporting of obligations under the following components:


        1. Australian Income Inclusion Rule (IIR)

        Applies a top-up tac on Australian parent entities if the group''s effective tax rate in another jurisdiction is below 15%.


        2. Australian Undertaxed Profits Rule (UTPR)

        Acts as a backstop to the IIR, applying a top-ip tax on Australian group entities when profits are not taxed under the IIR.


        3. Australian Domestic Minimum Top-up (DMT) Tax

        Ensures Australia retains primary taxing rights over low-taxed profits within its jurisdiction, consistent with the GloBE rules.


        **Effective Dates**


        - The IIR and DMT apply to fiscal years starting on or after 1 January 2024

        - The UTPR applies to fiscal years starting on or after 1 January 2025.'
      parameters:
      - $ref: '#/components/parameters/contextParam'
      - $ref: '#/components/parameters/transactionID'
      - $ref: '#/components/parameters/identifierValue'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalDomesticMinimumGroupEntityTaxReturnRequest'
        description: Request for lodging or amending the Combined Global and Domestic Minimum Tax Return on behalf on a group entity
        required: true
      operationId: requestGlobalDomesticGroupEntityTaxReturnForm
      responses:
        '202':
          description: Successful Response from Combined Global and Domestic Minumum Group Entity Tax Return
          headers:
            receipt:
              description: This is the BET transaction ID that is associated with the submitted form. This will be passed into subsequent API call to retrieve the PRN for this group entity.
              schema:
                type: string
                pattern: '[0-9]{13}'
                example: '6300000000001'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalDomesticMinimumGroupEntityTaxReturnResponse'
              examples:
                GlobalDomesticMinimumGroupEntityTaxReturnResponse:
                  $ref: '#/components/examples/GlobalDomesticMinimumGroupEntityTaxReturnResponse'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorsResponse'
              examples:
                BadRequestExample:
                  $ref: '#/components/examples/SchemaBadRequestResponse'
          description: Bad Request Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorsResponse'
              examples:
                ApiKeyInvalidExample:
                  $ref: '#/components/examples/ApiKeyInvalidResponse'
                InvalidCredentialExample:
                  $ref: '#/components/examples/InvalidCredentialResponse'
          description: Unauthorized Error responses
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorsResponse'
              examples:
                ForbiddenErrorExample:
                  $ref: '#/components/examples/ForbiddenErrorExample'
          description: Forbidden Access Error Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorsResponse'
              examples:
                UnprocessableEntityExample:
                  $ref: '#/components/examples/UnprocessableEntityResponse'
          description: Unprocessable Entity Response
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorsResponse'
              examples:
                InternalServerErrorExample:
                  $ref: '#/components/examples/InternalServerErrorResponse'
          description: Internal Server Error Response
    servers:
    - url: https://{env}/combinedMinimumGlobalDomesticReturn/v1
      description: 'Global and Domestic Minimum Group Entity Tax Return

        '
      variables:
        env:
          default: api.ato.gov.au
          description: 'This is the environment that is going to be used to hit the API

            '
          enum:
          - sandbox.api.ato.gov.au
          - api.ato.gov.au
components:
  schemas:
    Source:
      description: An object containing references to the source of the error.
      type: object
      properties:
        pointer:
          description: JSON Pointer [RFC6901] to the associated entity in the request document.
          example: /groupEntityDetails/groupEntityName
          type:
          - string
          - 'null'
        parameters:
          description: A string indicating which URI query parameter caused the error.
          example: context
          type:
          - string
          - 'null'
    Address:
      description: 'This will hold the specific information relating to the address of the group entity lodging the Combined Global and Domestic Tax Return. Can be either the Business or Postal Address Details.

        '
      properties:
        line1:
          description: 'First line of address using free form format, that is used to create a semi structured address.

            '
          type: string
          example: 34 wanderer street
          pattern: ^(?!unknown$|as\s*above$)(?!c\/o|c\/|care\s*of)[a-zA-Z0-9 !@$%&*()\-\=\[\]:;'",.?\/]+$
        line2:
          description: 'Second line of address using free form format, that is used to create a semi structured address.

            '
          type:
          - string
          - 'null'
          example: Unit 8
          pattern: ^(?!unknown$|as\s*above$)(?!c\/o|c\/|care\s*of)[a-zA-Z0-9 !@$%&*()\-\=\[\]:;'",.?\/]+$
        localityName:
          description: 'A word or combination of words, by which a geographic locality/suburb is designated or known.

