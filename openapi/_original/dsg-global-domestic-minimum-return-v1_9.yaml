                    enum: [TFN, ABN, ARN]
        groupEntityAssociateDetails:
          $ref: '#/components/schemas/GroupEntityAssociateDetails'
        foreignLodgementNotificationIndicator:
          description: |
            This is to indicate whether the lodger has lodged the Foreign Lodgment Notification on behalf of this group entity.
          type: boolean
        continueGlobalDomesticMinimumReturnIndicator:
          description: |
            - If you are lodging a foreign lodgment notification only then select `false` for `continueGlobalDomesticMinimumReturnIndicator`. This will also mean that the DMT,
                IIR and UTPR Tax liability amounts don't need to be passed into the request.
          type: boolean
        domesticMinimumTaxReturn:
          $ref: '#/components/schemas/DomesticMinimumTaxReturn'
        incomeInclusionRuleTaxReturn:
          $ref: '#/components/schemas/IncomeInclusionRuleTaxReturn'
        undertaxedProfitRuleTaxReturn:
          $ref: '#/components/schemas/UndertaxedProfitRuleTaxReturn'
      required:
        - identifierDetails
        - groupEntityName
        - groupEntityType
        - businessAddress
        - continueGlobalDomesticMinimumReturnIndicator
        - foreignLodgementNotificationIndicator
    IdentifierDetails:
      properties:
        identifierType:
          type: string
          description: |
            This will hold the different identifying type of information for the entities lodging this Return.
        identifierValue:
          type: string
          description: |
            Identifier value of the identifying type provided by the entities lodging the return.
          minLength: 5  # This will hold the other identifiers 
          maxLength: 200 # This will hold for TIN as its length is 200
          pattern: ^[A-Za-z0-9 `!@%#\$&()_\-=\[\]\{\}\\|;:'",\.\/\?]+$
      required:
        - identifierType
        - identifierValue
    GroupEntityAssociateDetails:
      description: |
        This will hold the specific information related to the primary associate entity contact of the group entity. 
        The `groupEnityAssociateDetails` information will not be passed if `groupEntityType` is passed in as any of the below options:

         - `Company`
         
         - `Main Entity of a GloBE Permanent Establishment that is a Company`
         
         - `GloBE Joint Venture`
         
      properties:
        associateEntityName:
          type: string
          example: "Test Pillar 2 Ltd"
          description: |
            This is the full name of the associate entity
          minLength: 2
          maxLength: 200
          pattern: ^(?![Nn] [Aa]$|[Nn]\'[Aa]$|[Aa]\/[Aa]$|[Nn]\/[Aa]$|[Nn] \/ 
            [Aa]$|[Nn]\/\s[Aa]$|[Nn]\s\/[Aa]$)[A-Za-z0-9 
            ,-`!@#$%\&()_=\[\]\{\}\|\;:'"\\.\?\/\-]*$
        taxFileNumber:
          type: string
          minLength: 8
          maxLength: 9
          nullable: true
          description: |
            This is the tax file number of the associate entity
        telephoneAreaCode:
          type: string
          description: |
            This is the area code of the associate entity.
          maxLength: 4
          pattern: ^\d+$
        telephoneNumber:
          type: string
          description: |
            This is the phone number of the associate entity.
          minLength: 7
          maxLength: 15
          pattern: ^\d+$
        postalAddress:
          $ref: '#/components/schemas/Address'
      required:
        - associateEntityName
        - telephoneAreaCode
        - telephoneNumber
        - postalAddress
    DomesticMinimumTaxReturn:
      description: |
        Will contain whether the group entity has to report domestic top up tax and if so what that amount is.

        **Note - This object only needs to be present in the request if `continueGlobalDomesticMinimumReturnIndicator` is set to `true`. Otherwise, you can skip passing 
        in details for this object.**
      properties:
        domesticTopUpTaxIndicator:
          description: |
            Indicate whether the group entity has to report a domestic top up tax amount.
            - If `domesticTopUpTaxIndicator` is set to **false** then there will be no need to pass any Domestic Top-up Tax Amount in the request. 
          type: boolean
        domesticTopUpTaxAmount:
          type: integer
          format: int64
          minimum: 0
          maximum: 99999999999
          description: |
            The domestic top up tax amount for the group entity. If the amount is nil, please enter '0' in the field.

            **Note - This field only needs to be present in the request if the answer to `domesticTopUpTaxIndicator` is set to `true`.**
      required:
        - domesticTopUpTaxIndicator
    IncomeInclusionRuleTaxReturn:
      type: object
      description: |
        Will contain whether the group entity has to report IIR top up tax and if so what that amount is and the parent entity type subject to the tax.

        **Note - This object only needs to be present in the request if `continueGlobalDomesticMinimumReturnIndicator` is set to `true`. Otherwise you can skip passing 
        in details for this object.**
      properties:
        incomeInclusionTopUpTaxIndicator:
          type: boolean
          description: |
            Indicate whether the group entity has to report a IIR top up tax amount.
             - If `incomeInclusionTopUpTaxIndicator` is set to **false** then there will be no need to pass any IIR Top-Up Tax Amount and associated parent entity in the request. 
        incomeInclusionTopUpTaxAmount:
          type: integer
          format: int64
          minimum: 0
          maximum: 99999999999
          description: |
            The IIR top up tax amount for the group entity. If the amount is nil, please enter '0' in the field.

            **Note - This field only needs to be present in the request if the answer to `incomeInclusionTopUpTaxIndicator` is set to `true`.**

        parentEntityType:
          enum:
            - UPE
            - IPE
            - POPE
          example: UPE
          type: string
          description: |
            The parent entity type of the group entity subject to the IIR tax.

               **Note - This field only needs to be present in the request if the answer to `incomeInclusionTopUpTaxIndicator` is set to `true`.**

               **Parent Entity Type Description Table**
            |Parent Entity Type Code| Description                   |
            |-----------------------|-------------------------------|
            |UPE                    | Ultimate parent entity        |
            |IPE                    | Intermediate parent entity    |
            |POPE                   | Partially owned parent entity |

      required:
        - incomeInclusionTopUpTaxIndicator
    UndertaxedProfitRuleTaxReturn:
      description: |
        Will contain whether the group entity has to report UTPR top up tax and if so what that amount is.

        **Note - This object only needs to be present in the request if `continueGlobalDomesticMinimumReturnIndicator` is set to `true` and `periodStartDate` is on 
        or after 01/01/2025. Otherwise you can skip passing in details for this object.**
      type: object
      properties:
        undertaxedProfitsTopUpTaxIndicator:
          description: |
            Indicate whether the group entity has to report a UTPR top up tax amount.
            - If `undertaxedProfitsTopUpTaxIndicator` is set to **false** then there will be no need to pass any UTPR Top-up Tax Amount in the request. 
          type: boolean
        undertaxedProfitsTopUpTaxAmount:
          description: |
            The UTPR top up tax amount for the group entity. If the amount is nil, please enter '0' in the field.

            **Note - This field only needs to be present in the request if the answer to `undertaxedProfitsTopUpTaxIndicator` is set to `true`.**
          type: integer
          format: int64
          minimum: 0
          maximum: 99999999999
      required:
        - undertaxedProfitsTopUpTaxIndicator
    UltimateParentEntity:
      description: This will contain the information of the ultimate parent 
        entity (UPE) for the Combined Global and Domestic Minimum Tax Return
      properties:
        lodgingEntitySameAsUPEIndicator:
          description: |
            This is to determine whether the entity lodging the Combined Global and Domestic Minimum Tax Return is the same as the ultimate parent entity (UPE).
             - If `lodgingEntitySameAsUPEIndicator` is set to **false** then the extra `ultimateParentEntityDetails` will need to be passed in the request. If passed as **true**
              then the extra ultimate parent entity details won't need to be passed in the request.
          type: boolean
        ultimateParentEntityDetails:
          $ref: '#/components/schemas/UltimateParentEntityContact'
      required:
        - lodgingEntitySameAsUPEIndicator
        - ultimateParentEntityDetails
    UltimateParentEntityContact:
      description: |
        This will contain the contact details of the ultimate parent entity (UPE) if required for the Combined Global and Domestic Minimum Tax Return.

        **Note - This information only needs to be in the request if the answer to `lodgingEntitySameAsUPEIndicator` is `false`.**
      properties:
        ultimateParentEntityName:
          description: |
            This is the full name of the ultimate parent entity (UPE).
          type: string
          example: "Test Pillar 2 Ltd"
          maxLength: 200
          pattern: ^(?![Nn] [Aa]$|[Nn]\'[Aa]$|[Aa]\/[Aa]$|[Nn]\/[Aa]$|[Nn] \/ 
            [Aa]$|[Nn]\/\s[Aa]$|[Nn]\s\/[Aa]$)[A-Za-z0-9 
            ,-`!@#$%\&()_=\[\]\{\}\|\;:'"\\.\?\/\-]*$
        identifierDetails:
          type: array
          description: |
            - This is the identifying information for the ultimate parent entity (UPE). At least one of the following identifiers are to be provided **TFN/ABN/TIN**. If providing both TFN and ABN make sure this is for the same entity.
          items:
            allOf:
              - $ref: '#/components/schemas/IdentifierDetails'
              - type: object
                properties:
                  identifierType:
                    type: string
                    enum: [TFN, ABN, TIN]
        postalAddress:
          description: |
            This is the postal address of the ultimate parent entity (UPE).
          allOf:
            - $ref: '#/components/schemas/Address'
        jurisdictionCountryCode:
          description: |
            This is the jurisdiction country code in which the ultimate parent entity (UPE) is located.
          allOf:
            - $ref: '#/components/schemas/CountryCodes'
          type: string
      required:
        - ultimateParentEntityName
        - postalAddress
        - jurisdictionCountryCode
        - identifierDetails
    GIRLodgmentDetails:
      type: object
      description: |
        This will contain the information to determine whether the GloBE Information Return (GIR) has been lodged domestically or from a foreign jurisdiction.
           - Either `girLodgeOptions` or `domesticGirLodgeDate` will need to be passed and not both. This will help determine if the GloBE Information Return (GIR)
            is being lodged domestically or from a foreign jurisdiction. 
            - If `girLodgeOptions` is passed in with the value **UPE** then `upeGirReceivingIndicator` will need to be passed into the request at a minimum. If the
              answer to this is **true** then `upeGirLodgeDate` will also need to be passed into the request.
      properties:
        girLodgeOptions:
          enum:
            - DFE
            - UPE
          type: string
          description: |
            This will be the type that the foreign entity is lodging the GloBE Information Return (GIR) as.
             **GIR lodgement options description Table**
             
            |GIR lodgement options  | Description                                                         |
            |-----------------------|---------------------------------------------------------------------|
            |DFE                    | GIR is lodged or will be lodged by DFE in a foreign jurisdiction    |
            |UPE                    | GIR is lodged or will be lodged by UPE in a foreign jurisdiction    |     
        domesticGirLodgeDate:
          type: string
          format: date
          example: "2024-03-20"
          description: |
            This will be the date that the GloBE Information Return (GIR) was lodged if it was done domestically.
        upeGirReceivingIndicator:
          description: |
            This will outline if the ultimate parent entity (UPE) will be sending the ATO the GloBE Information Return (GIR) under Exchange of Information.
          type: boolean
        upeGirLodgeDate:
          type: string
          format: date
          example: "2024-03-20"
          description: |
            This will be the date that the GloBE Information Return (GIR) was lodged by the ultimate parent entity (UPE).
    DesignatedFilingEntity:
      type: object
      description: |
        This will contain the details of the designated filing entity (DFE)
         - If `girLodgeOptions` was passed in with the value of DLE then the designated local entity details will need to be provided. If not, then designated local entity information doesn't need to be passed into the request.
      properties:
        designatedFilingEntityFullName:
          type: string
          example: "Test Pillar 2 Ltd"
          description: |
            This is the full name of the designated filing entity (DFE).
          pattern: ^(?![Nn] [Aa]$|[Nn]\'[Aa]$|[Aa]\/[Aa]$|[Nn]\/[Aa]$|[Nn] \/ 
            [Aa]$|[Nn]\/\s[Aa]$|[Nn]\s\/[Aa]$)[A-Za-z0-9 
            ,-`!@#$%\&()_=\[\]\{\}\|\;:'"\\.\?\/\-]*$
          maxLength: 200
        identifierDetails:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/IdentifierDetails'
              - type: object
                properties:
                  identifierType:
                    type: string
                    enum: [TFN, ABN, TIN]

          description: |
            This is the identifying information for the designated filing entity (DFE). At least one of the following identifiers are to be provided **TFN/ABN/TIN**. If providing both TFN and ABN make sure this is for the same entity.
        postalAddress:
          $ref: '#/components/schemas/Address'
        jurisdictionCountryCode:
          allOf:
            - $ref: '#/components/schemas/CountryCodes'
          type: string
          description: |
            This is the jurisdiction country code in which the designated filing entity (DFE) is located.
        dfeGirReceivingIndicator:
          type: boolean
          description: |
            This will outline if the designated filing entity (DFE) will be sending the ATO the GloBE Information Return (GIR) under Exchange of Information.
             - If `dfeGirReceivingIndicator` is passed in as **true** then `dfeGirLodgeDate` will also need to be passed into the request.
        dfeGirLodgeDate:
          type: string
          description: |
            This will be the date that the GloBE Information Return (GIR) was lodged by the designated filing entity (DFE).
          format: date
          example: "2024-03-20"
      required:
        - designatedFilingEntityFullName
        - postalAddress
        - jurisdictionCountryCode
        - dfeGirReceivingIndicator
        - identifierDetails
    GIRForexDetails:
      description: |
        This will outline the foreign exchange rate details used for the GloBE Information Return (GIR).
            - If any of the group entities in the `groupEntities` have DMT, IIR, UTPR liabilities (greater or equal to $0) then this section will need to be provided in the request.
      properties:
        currencyUsedForGir:
          description: |
            This is the currency that was used in the GloBE Information Return (GIR) for the DMT, IIR and UTPR top-up tax amounts.
          allOf:
            - $ref: '#/components/schemas/CurrencyCodes'
          type: string
          nullable: true
        exchangeRateUsedForGir:
          description: |
            This is the exchange rate that was used in the GloBE Information Return (GIR) to convert the DMT, IIR and UTPR top-up tax amounts.
          type: number
          format: double
        convertForeignCurrencyMethodology:
          description: |
            This is the methodology you used to convert the DMT, IIR and UTPR top-up tax amounts.
          type: string
          minLength: 1
          maxLength: 200
