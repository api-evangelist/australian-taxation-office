    Declaration:
      description: |
        This will be used to declare that all information provided on the Combined Global and Domestic Minimum Tax Return is accurate before submitting.

        Before making this declaration check to ensure that all top up tax amounts have been disclosed, and the tax return is true and correct in every detail. If you are in doubt about any aspect of the tax return, place all the facts before the ATO. The tax laws impose heavy penalties for false or misleading statements in tax returns. This declaration must be signed by an authorised contact of the DLE or the DLE(s) Public Officer. However, if completing this form as a Group Entity, the Group Entity(s) authorised contact or Public Officer must sign this declaration.

        Note: Group Entity for the purpose of this form includes GloBE Joint Ventures and GloBE JV Subsidiaries.
        Privacy Statement
        We are authorised to request TFNs by the Taxation Administration Act 1953.  We use them to identify you and if applicable, other entities on behalf of which you are authorised to lodge this form (the Group Entities). It is not an offence not to provide TFNs. However, this may cause delays in processing your form.
        Taxation law authorises us to collect information and disclose it to other government agencies. This includes personal information of the person authorised to complete the form and sign the declaration. See more about your privacy at ato.gov.au/privacy
      properties:
        declarationStatementAcceptance:
          description: |
            Select a valid value from the enum to indicate the capacity that you are making the declaration for the tax return.

             **Declaration code description Table**
            |Declaration Statement Acceptance |Declaration Statements Accepted    |
            |---------------------------------|-----------------------------------|
            |GED                              |I declare that I am a Group Entity and that the information in this tax return is true and correct. |
            |GEIPD                            |I declare that I have been appointed under the _Corporations Act 2001_ to act on behalf of the Group Entity in my capacity as an insolvency practitioner and I declare that the information in this tax return is true and correct. |
            |DLED                             |I declare that I am a Designated Local Entity submitting this tax return and declare all of the following statements are accepted:
            |                                 | <ol><li>The information in this tax return is true and correct.</li><li>This tax return has been prepared in accordance with information supplied by the Group Entity/ies.</li><li>I have received a declaration from the Group Entity/ies stating that the information is true and correct.</li><li>I am authorised by the Group Entity/ies to give this tax return to the Commissioner of Taxation.</li></ol> |
            |TAD                              |I declare that I am a tax agent submitting this tax return on behalf of a Group Entity or Designated Local Entity and declare that all of the following statements are accepted:
            |                                 | <ol><li>This tax return has been prepared in accordance with information supplied by the Group Entity/ies.</li><li>I have received a declaration from the Group Entity/ies stating that the information is true and correct.</li><li>I am authorised by the Group Entity/ies to give this tax return to the Commissioner of Taxation.</li></ol> |            
          type: string
          enum:
            - GED
            - GEIPD
            - DLED
            - TAD
        taxAgentDetails:
          $ref: '#/components/schemas/TaxAgent'
        declarationDate:
          type: string
          format: date
          example: "2024-06-30"
          description: |
            This is the date that the declaration was made on.
      required:
        - declarationDate
        - declarationStatementAcceptance
    TaxAgent:
      description: |
        This will be used to hold the details for the tax agent that is lodging the Combined Global and Domestic Minimum Tax Return.
      properties:
        clientReference:
          type: string
          description: |
            This is the tax agent's reference number of the client.
          maxLength: 10
          minLength: 1
        agentFullName:
          type: string
          example: "Mark Martin"
          description: |
            This is the full name of the tax agent.
          maxLength: 38
          pattern: ^[-' A-Za-z0-9]+$
        agentTelephoneAreaCode:
          type: string
          description: |
            This is the area code of the tax agent's telephone number.
          maxLength: 4
          minLength: 2
          pattern: ^\d+$
        agentTelephoneNumber:
          type: string
          description: |
            The phone number of tax agent.
          minLength: 7
          maxLength: 15
          pattern: ^\d+$
      required:
        - clientReference
        - agentFullName
        - agentTelephoneAreaCode
        - agentTelephoneNumber
    GlobalDomesticMinimumTaxReturnResponse:
      description: |
        This is the response for the Combined Global and Domestic Minimum Tax Return when successfully submitted.
      properties:
        message:
          description: |
            Response message to let the lodger know their lodgment was successful
          type: string
        date:
          description: |
            Timestamp for when the lodgement was completed
          type: string
          format: date-time
      required:
        - message
        - date
    ApiErrorsResponse:
      description: |
        Full error payload returned to client. Will contain multiple errors if there are multiple that get returned.
      properties:
        errors:
          items:
            $ref: '#/components/schemas/ApiError'
          type: array
    ApiError:
      title: ApiError
      type: object
      properties:
        detail:
          type: string
          description: |
            A human-readable explanation specific to this occurrence of the problem.
          nullable: true
        code:
          type: string
          description: |
            An application-specific error code.
          nullable: true
        source:
          $ref: '#/components/schemas/Source'
      description: |
        This will hold the response error details.
    Source:
      title: Source
      type: object
      properties:
        pointer:
          type: string
          description: 'JSON Pointer [RFC6901] to the associated entity in the request
            document.'
          nullable: true
        parameter:
          type: string
          description: |
            A string indicating which URI query parameter caused the error.
          nullable: true
      description: |
        An object containing references to the source of the error.
  examples:
    BadRequestExample:
      summary: Schema Bad Request response
      description: |
        Example Schema Bad Request response
      value:
        errors:
          - code: OAS.VAL.00000
            detail: 'Object has missing required properties ([''periodStartDate''])'
    UnauthorisedExample:
      summary: Schema Unauthorised Request response
      description: |
        Example Schema Unauthorised Request response
      value:
        errors:
          - code: 401-01
            detail: 'api key is invalid'
    ForbiddenExample:
      summary: Schema Forbidden Request response
      description: |
        Example Schema Forbidden Request response
      value:
        errors:
          - code: 403-01
            detail: 'Forbidden'
    NotFoundExample:
      summary: Schema Not Found response
      description: |
        Example Schema not found response
      value:
        errors:
          - code: 404-01
            detail: 'No API path found that matches request ''{request.uri}'''
    ClientIdentifierErrorResponse:
      summary: Unprocessable Entity Error
      description: |
        client identifier error
      value:
        errors:
          - code: PYID.00005
            detail: TFN is invalid
            source:
              parameter: TFNBusiness
    InternalServerErrorResponse:
      summary: Internal Server Error response
      description: |
        Example Internal Server Error response
      value:
        errors:
          - code: 500-01
            detail: 'Your request cannot be processed. Please try again later.  If
              the problem persists, please contact ATO'
    GlobalDomesticMinimumTaxReturnResponse:
      summary: Combined Global and Domestic Minimum Tax Return Successfully 
        submitted response
      description: |
        Example Combined Global and Domestic Minimum Tax Return Successfully submitted response
      value:
        message: "The Combined Global and Domestic Minimum Tax Return was successfully
          submitted."
        date: "2025-06-30T12:30:00+10:00"
