          type: string
        businessAddress:
          $ref: '#/components/schemas/Address'
        identifierDetails:
          type: array
          description: |
            - At least one of the following identifiers are to be provided **TFN/ABN/ARN**. If providing both TFN and ABN make sure this is for the same group entity.
          items:
            allOf:
