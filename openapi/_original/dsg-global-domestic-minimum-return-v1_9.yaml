openapi: 3.0.0
info:
  description: |
    The Global and Domestic Minimum Tax Return API allows software users to lodge a Combined Global and Domestic Minimum Tax
    Return directly to the Australian Taxation Office for one or multiple entities within their multi-national enterprise
    (MNE) group. 
  version: 1.1.60
  x-status:
    status: Proposed
  title: Global and Domestic Minimum Tax Return API
servers:
  - url: 'https://{env}/combinedMinimumGlobalDomesticReturn/v1'
    description: |
      Global and Domestic Minimum Tax Return
    variables:
      env:
        default: api.ato.gov.au
        description: |
          this is the environment that is going to be used to hit the API
        enum:
          - sandbox.api.ato.gov.au
          - api.ato.gov.au
paths:
  /clients/ABN/{identifierValue}/globalDomesticReturn:
    post:
      tags:
        - Combined Global and Domestic Minimum Tax Return
      summary: This endpoint will allow you to either lodge or amend a Combined 
        Global and Domestic Minimum Tax Return.
      description: |
        This API is to support the digital lodgment of tax returns for entities that are subject to Australia's implementation
        of the OECD's Global Anti-Base Erosion (GloBE) Rules. It facilitates the reporting of obligations under the following 
        components:

        **1. Foreign Lodgment Notification (FN)**
           Notify the ATO that a foreign entity will lodge the GloBE Information Return with a foreign tax authority on behalf
           of the Australian Entity.

        **2. Australian Income Inclusion Rule (IIR) Tax**
           Applies a top-up tax on Australian parent entities when the group's effective tax rate in another jurisdiction is below 15%.

        **3. Australian Undertaxed Profits Rule (UTPR) Tax**
           Applies a top-up tax on Australian group entities when profits are not brought into charge under the income Inclusion
           rule (IIR).

        **4. Australian Domestic Minimum Top-up (DMT) Tax**
           Ensure Australia can impose a top-up tax on low-taxed domestic profits, in priority over the income inclusion rule
           (IIR) and undertaxed profits rule (UTPR), consistent with the GloBE Rules.

        **Effective Dates**

        - The FN, IIR and DMT apply to fiscal years starting on or after 1 January 2024
        - The UTPR applies to fiscal years starting on or after 1 January 2025
      parameters:
        - $ref: '#/components/parameters/contextParam'
        - $ref: '#/components/parameters/identifierValue'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CombinedMinimumGlobalDomesticReturnRequest'
        required: true
      operationId: requestGlobalDomesticMinimumTaxReturnFormABN
      responses:
        '400':
          description: |
            Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorsResponse'
              examples:
                BadRequestExample:
                  $ref: '#/components/examples/BadRequestExample'
        '401':
          description: |
            Unauthorised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorsResponse'
              examples:
                BadRequestExample:
                  $ref: '#/components/examples/UnauthorisedExample'
        '403':
          description: |
            Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorsResponse'
              examples:
                BadRequestExample:
                  $ref: '#/components/examples/ForbiddenExample'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorsResponse'
              examples:
                BadRequestExample:
                  $ref: '#/components/examples/NotFoundExample'
        '422':
          description: |
            Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorsResponse'
              examples:
                ClientIdentifierErrorResponse:
                  $ref: '#/components/examples/ClientIdentifierErrorResponse'
        '500':
          description: |
            Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorsResponse'
              examples:
                InternalServerErrorResponse:
                  $ref: '#/components/examples/InternalServerErrorResponse'
        '201':
          description: |
            Successful Response from Combined Global and Domestic Minimum Tax Return call
          headers:
            receipt:
              description: |
                This is the BET transaction ID that is associated with the submitted form. This will be passed into subsequent group entity form API call
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalDomesticMinimumTaxReturnResponse'
              examples:
                GlobalDomesticMinimumTaxReturnResponse:
                  $ref: '#/components/examples/GlobalDomesticMinimumTaxReturnResponse'
components:
  parameters:
    contextParam:
      name: context
      required: false
      in: query
      style: deepObject
      explode: false
      description: |
        The `context` parameter specifies the Registered Agent Number (RAN)

        - When a client is submitting a request to lodge or amend the Combined Global and Domestic Minimum Tax Return: `context` is not required.
        - When an agent is acting on behalf of the client to lodge or amend the Combined Global and Domestic Minimum Tax Return the TAN or RAN of the 
        intermediary has to be provided in the context, e.g.: `context[TAN]={TAN}` or `context[RAN]={RAN}`.
      schema:
        type: deepObject
        $ref: '#/components/schemas/context'
      examples:
        RAN:
          summary: Tax Agent - RAN
          value: ?context[RAN]=17801003
        TAN:
          summary: Tax Agent - TAN
          value: ?context[TAN]=17801003
    identifierValue:
      name: identifierValue
      required: true
      in: path
      description: |
        This will be the value of the ABN being passed. This is to be passed in the URI path.
      schema:
        type: string
        pattern: ^[0-9]{9,11}$
        maxLength: 11
  schemas:
    context:
      oneOf:
        - $ref: '#/components/schemas/TANContext'
        - $ref: '#/components/schemas/RANContext'
    TANContext:
      type: object
      required:
        - TAN
      properties:
        TAN:
          type: string
    RANContext:
      type: object
      required:
        - RAN
      properties:
        RAN:
          type: string
    CombinedMinimumGlobalDomesticReturnRequest:
      type: object
      properties:
        reportingFiscalYear:
          description: |
            Your fiscal year is generally the same accounting period to which your Ultimate Parent Entity (UPE) prepares its 
            Consolidated Financial Statement in accordance with an Acceptable Financial Accounting Standard.
          allOf:
            - $ref: '#/components/schemas/ReportingFiscalYear'
        lodgingEntity:
          $ref: '#/components/schemas/LodgingEntity'
        groupEntities:
          type: array
          maxItems: 300
          minItems: 1
          description: |
            This will hold all the information for all group entities as part of the multi-national enterprise (MNE). Can be multiple group entities passed.

            **Note -  Repeat for each group entity of the group who is NOT part of the Tax Consolidated Group (TCG) or Multiple Entry Consolidated (MEC) group.

              If you are part of a TCG or MEC Group, only details of the head representative entity of the TCG or the provisional head representative entity of the MEC Group
              needs to be completed in this section. However, if there is Income Inclusion Rule (IIR) liability, where multiple group entities that are parent entities have the 
              IIR liability, every one of the liable entities must be included in this section. This may include a NIL amount.**
          items:
            $ref: '#/components/schemas/GroupEntity'
        ultimateParentEntity:
          $ref: '#/components/schemas/UltimateParentEntity'
        girLodgmentDetails:
          $ref: '#/components/schemas/GIRLodgmentDetails'
        foreignLodgmentNotification:
          $ref: '#/components/schemas/DesignatedFilingEntity'
        girForexDetails:
          $ref: '#/components/schemas/GIRForexDetails'
        declaration:
          $ref: '#/components/schemas/Declaration'
      additionalProperties: false
      required:
        - groupEntities
        - ultimateParentEntity
        - girLodgmentDetails
        - reportingFiscalYear
        - lodgingEntity
        - declaration
    ReportingFiscalYear:
      type: object
      description: |
        This will hold the start and end date of the fiscal year the Combined Global and Domestic Minimum Tax Return is lodged for.

        **Note - Your fiscal year is generally the same accounting period to which your Ultimate Parent Entity (UPE) prepares its 
        Consolidated Financial Statement in accordance with an Acceptable Financial Accounting Standard.**
      properties:
        periodStartDate:
          type: string
          format: date
          example: "2024-01-01"
          description: |
            This is the start date (YYYY-MM-DD) of the fiscal year the Combined Global and Domestic Minimum Tax Return is lodged for.
        periodEndDate:
          type: string
          format: date
          example: "2024-06-30"
          description: |
            This is the end date (YYYY-MM-DD) of the fiscal year the Combined Global and Domestic Minimum Tax Return is lodged for.
        transactionTypeCode:
          description: |
            This will hold the transaction type of the parent form whether it is an original or amended form.

              **Transaction Type Description Table**
            |Transaction Type Code| Description                                                                                                       |
            |---------------------|-------------------------------------------------------------------------------------------------------------------|
            |ORIGINAL             | Select this for submitting an original lodgment of the Combined Global and Domestic Minimum Tax Return            |
            |AMENDMENT            | Select this for submitting an amendment to update the previously submitted information.                           |
          type: string
          enum:
            - ORIGINAL
            - AMENDMENT
      required:
        - periodStartDate
        - periodEndDate
        - transactionTypeCode
    LodgingEntity:
      type: object
      description: |
        This will hold all the information of the entity that is lodging the Combined Global and Domestic Minimum Tax Return.
      properties:
        lodgingEntityCode:
          enum:
            - GE
            - DLE
          type: string
          description: |
            Select the entity that you are going to be lodging the Combined Global and Domestic Minimum Tax Return as. This is to nominate the capacity in which you are completing the Combined Global and Domestic Minimum Tax Return.

              **Lodging EntityCode Description Table**
            |Lodging Entity Code| Description             |
            |-------------------|-------------------------|
            |GE                 | Group Entity            |
            |DLE                | Designated Local Entity |
        lodgingEntityName:
          type: string
          description: |
            The full name of the entity that is lodging the Combined Global and Domestic Minimum Tax Return.
          maxLength: 200
          pattern: ^(?![Nn] [Aa]$|[Nn]\'[Aa]$|[Aa]\/[Aa]$|[Nn]\/[Aa]$|[Nn] \/ 
            [Aa]$|[Nn]\/\s[Aa]$|[Nn]\s\/[Aa]$)[A-Za-z0-9 
            ,-`!@#$%\&()_=\[\]\{\}\|\;:'"\\.\?\/\-]*$
          example: Test Pillar 2 Ltd
        identifierDetails:
          description: |
            - This is the identifying information for the lodging entity. At least one of the following identifiers are to be provided **TFN/ABN/ARN/TIN**. If providing both TFN and ABN make sure this is for the same entity.
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/IdentifierDetails'
              - type: object
                properties:
                  identifierType:
                    type: string
                    enum: [TFN, ABN, ARN, TIN]
        lodgingEntityAuthorisedContact:
          $ref: '#/components/schemas/LodgingEntityAuthorisedContact'
        postalAddress:
          description: |
            - For the address information an Australian address is being requested here. An overseas address should only be provided if there is no applicable address in Australia for the entity.
          allOf:
            - $ref: '#/components/schemas/Address'
        businessAddress:
          description: |
            - For the address information an Australian address is being requested here. An overseas address should only be provided 
               if there is no applicable address in Australia for the entity.
          allOf:
            - $ref: '#/components/schemas/Address'
        lodgingEntityType:
          allOf:
            - $ref: '#/components/schemas/EntityTypes'
          type: string
        lodgingEntityAssociateDetails:
          $ref: '#/components/schemas/LodgingEntityAssociateDetails'
      required:
        - lodgingEntityCode
        - lodgingEntityName
        - lodgingEntityType
        - lodgingEntityAuthorisedContact
        - postalAddress
        - businessAddress
    LodgingEntityAuthorisedContact:
      type: object
      description: |
        This will hold all the contact information of the authorised contact on who is lodging the Combined Global and Domestic Minimum Tax Return.

        **Note there are some call outs to be aware of here:**
           - Only provide a non-local number if local number is not applicable.
           - An Australian address is being requested here. An overseas address should only be provided if there is no applicable address in Australia for the entity
      properties:
        fullName:
          type: string
          description: |
            The full name of the authorised contact for either the group entity or designated local entity lodging the return.
          minLength: 2
          maxLength: 200
          pattern: ^[-' A-Za-z0-9]+$
          example: "Mark Martin"
        telephoneCountryCode:
          type: string
          description: |
            The international code of the authorised contacts phone number for either the group entity or designated local entity lodging the return.
          minLength: 2
          maxLength: 4
        telephoneNumber:
          type: string
          description: |
            The phone number of the authorised contact for either the group entity or designated local entity lodging the return.
              - For the phone number only provide a non-local number if local number is not applicable.
          minLength: 7
          maxLength: 15
          pattern: ^\d+$
        electronicMailAddress:
          type: string
          format: email
          example: "test@test.com.au"
          maxLength: 200
          description: |
            The email address of the authorised contact for either the group entity or designated local entity lodging the return.
          pattern: 
            ^[a-zA-Z0-9!#$%&*+=?^_`|~-]+(?:\.[a-zA-Z0-9!#$%&*+=?^_`|~-]+)*@(?:[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?\.)+[a-zA-Z0-9](?:[a-zA-Z0-9-]*[a-zA-Z0-9])?$
      required:
        - fullName
        - telephoneCountryCode
        - telephoneNumber
        - electronicMailAddress
    LodgingEntityAssociateDetails:
      type: object
      description: |
        This will hold all the contact information of the associate entity for the entity lodging the Combined Global and Domestic Minimum Tax Return.

        **Note - The `lodgingEntityAssociateDetails` information will not need to be passed
        if `lodgingEntityType` is passed in as any of the below options:

          - `Company`
          
          - `Main Entity of a GloBE Permanenet Establishment that is a Company`
          
          - `GloBE Joint Venture`**
          
      properties:
        associateEntityName:
          type: string
          description: |
            This is the full name of the associate entity
          minLength: 2
          maxLength: 200
          example: "Test Pillar 2 Ltd"
          pattern: ^(?![Nn] [Aa]$|[Nn]\'[Aa]$|[Aa]\/[Aa]$|[Nn]\/[Aa]$|[Nn] \/ 
            [Aa]$|[Nn]\/\s[Aa]$|[Nn]\s\/[Aa]$)[A-Za-z0-9 
            ,-`!@#$%\&()_=\[\]\{\}\|\;:'"\\.\?\/\-]*$
        taxFileNumber:
          type: string
          minLength: 8
          maxLength: 9
          description: |
            This is the tax file number of the associate entity
          nullable: true
        telephoneCountryCode:
          type: string
          description: |
            This is the international code of the associate entities phone number.
          minLength: 2
          maxLength: 4
        telephoneNumber:
          type: string
          description: |
            This is the phone number including area code of the associate entity.
          minLength: 7
          maxLength: 15
          pattern: ^\d+$
        postalAddress:
          $ref: '#/components/schemas/Address'
      required:
        - associateEntityName
        - telephoneCountryCode
        - telephoneNumber
        - postalAddress
    Address:
      properties:
        line1:
          example: 34 wanderer street
          description: |
            First line utilising free format, that is used to create a semi structured address.
          type: string
          maxLength: 38
          pattern: ^(?!unknown$|as\s*above$)(?!c\/o|c\/|care\s*of)[a-zA-Z0-9 
            !@$%&*()\-\=\[\]:;'",.?\/]+$
        line2:
          example: Unit 8
          description: |
            Second line utilising free format, that is used to create a semi structured address.
          type: string
          maxLength: 38
          pattern: ^(?!unknown$|as\s*above$)(?!c\/o|c\/|care\s*of)[a-zA-Z0-9 
            !@$%&*()\-\=\[\]:;'",.?\/]+$
          nullable: true
        localityName:
          example: Mt Helen
          description: |
            A word or combination of words, by which a geographic locality/suburb is designated or known.
          type: string
          maxLength: 46
          pattern: ^(?!unknown$)[a-zA-Z0-9 !@$%&*()\-\=\[\]:;'",.?\/]+$
        stateOrTerritoryCode:
          enum:
            - ACT
            - NSW
            - NT
            - QLD
            - SA
            - TAS
            - VIC
            - WA
          description: |
            The code that is assigned to each Australian State or Territory.
          example: VIC
          type: string
        countryCode:
          allOf:
            - $ref: '#/components/schemas/CountryCodes'
          description: |
            This represents the Country Code as prescribed by AS4590 and inherited from ISO 3166.
          example: AU
          type: string
          maxLength: 3
        postCode:
          description: |
            The descriptor for a postal delivery area, aligned with locality, suburb or place. Can be used for an Australian or non-Australian address.
          example: 3000
          maxLength: 12
          type: string
      description: |
        This will hold the specific information relating to the address of the entities lodging the Combined Global and Domestic Tax Return. Can be either the Business or Postal Address Details.
      type: object
      required:
        - line1
        - localityName
        - countryCode
    EntityTypes:
      description: |
        This is the list of entity types which can be used for lodging the Combined Global and Domestic Minimum Tax Return. Can be used for lodging entity as well as group entity.

         | Value          | Description                                                                                            |
         |----------------|--------------------------------------------------------------------------------------------------------|
         |COMPY           | Company                                                                                                |
         |GPRTN           | GloBE partnership                                                                                      |
         |TRUST           | Trust                                                                                                  |
         |MCOMP           | Main entity of a GloBE permanent establishment that is a company                                       |
         |NCOMP           | Main entity of a GloBE permanent establishment that is not a company                                   |
         |JVOTH           | GloBE joint venture                                                                                    |
         |JVPRT           | Unincorporated GloBE joint venture that is a GloBE partnership                                         |
         |JVNTP           | Unincorporated GloBE joint venture that is not a trust or GloBE partnership                            |
         |JSPRT           | Unincorporated GloBE joint venture subsidiary where the subsidiary is a GloBE partnership              |
         |JSNTP           | Unincorporated GloBE joint venture subsidiary where the subsidiary is not a trust or GloBE partnership |
         |UENTP           | Unincorporated Group Entity that is not a trust or a GloBE partnership                                 |
         
      type: string
      enum:
        - COMPY
        - GPRTN
        - TRUST
        - MCOMP
        - NCOMP
        - JVOTH
        - JVPRT
        - JVNTP
        - JSPRT
        - JSNTP
        - UENTP

    CountryCodes:
      type: string
      description: |
