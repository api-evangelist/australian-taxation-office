    PathBadRequestResponse:
      summary: Schema API Path Bad Request response
      description: Example Schema API Path Bad Request response
      value: |-
        {
          "errors": [
          {
            "code": "RSF.00000",
            "detail": "No API path found that matches request '{entered_API_Path}'."
          }
          ]
        }
    InternalServerErrorResponse:
      summary: Internal Server Error response
      description: Example Internal Server Error response
      value: |-
        {
          "errors": [
          {
            "code": "RSF.00003",
            "detail": "Your request cannot be processed. Please try again later.  If the problem persists, please contact ATO"
          }
          ]
        }
  schemas:
    StapledSuperFundRequest:
      properties:
        payee:
          $ref: '#/components/schemas/Payee'
        declaration:
          $ref: '#/components/schemas/Declaration'
      description: The information needed for the stapled superfund request payload structure
      type: object
      required:
      - payee
      - declaration
    Payee:
      properties:
        payeePayrollId:
          example: ERN12345467
          description: The Employment Payroll Number. Number allocated by the payer payroll system to identify a payee. This identifier will be quoted on any correspondence regarding the payee's declaration to assist correct identification of the payee.
          type: string
          maxLength: 200
          nullable: true
        personName:
          $ref: '#/components/schemas/PersonName'
        personDemographic:
          $ref: '#/components/schemas/PersonDemographic'
        addressResidential:
          $ref: '#/components/schemas/Address'
        addressPostal:
          $ref: '#/components/schemas/Address'
      description: This will hold the specific information related to the payee (employee)
      type: object
      required:
      - personName
      - personDemographic
    PersonName:
      properties:
        familyName:
          example: Martin
          description: The person's last name or surname. The name by which a family group is identified.
          type: string
          pattern: ^([0-9a-zA-Z \.,\?\(\)\[\]:;'\-=\/@$%\*&!"])*$
          maxLength: 40
        givenName:
          example: Mark
          description: The name given to a person which is that person's identifying name within the family group or the name by which the person is uniquely socially identified; the name borne by an individual, often assigned by his or her parents shortly after birth, as opposed to the inherited surname.
          type: string
          pattern: ^([0-9a-zA-Z \.,\?\(\)\[\]:;'\-=\/@$%\*&!"])*$
          maxLength: 40
        otherGivenName:
          example: Matthew
          description: The middle name given to a person which complements that person's identifying name within the family group or the name by which the person is uniquely socially identified.
          type: string
          maxLength: 40
          pattern: ^([0-9a-zA-Z \.,\?\(\)\[\]:;'\-=\/@$%\*&!"])*$
          nullable: true
      description: This will hold the specific information relating to the name details for the payee.
      type: object
      required:
      - familyName
      - givenName
    PersonDemographic:
      properties:
        birthDm:
          example: 31
          description: The date of the day in the month in which an individual was born.
          type: integer
          minimum: 1
          maximum: 31
        birthM:
          example: 10
          description: The month in which an individual was born.
          type: integer
          minimum: 1
          maximum: 12
        birthY:
          example: 2000
          description: The year in which an individual was born.
          type: integer
          minimum: 1800
          maximum: 9999
      required:
      - birthDm
      - birthM
      - birthY
    Address:
