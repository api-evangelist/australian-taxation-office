      summary: Exempt TFN Code Address response
      description: Example Exempt TFN Code Address response
      value: |-
        {
          "errors": [
            {
              "code": "ADDR.00001",
              "detail": "If an exempted TFN code is present, Payee residential address or Payee postal address must be provided."
            }
