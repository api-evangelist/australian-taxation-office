# x-archived-on: 2026-10-22
openapi: 3.0.0
info:
  description: "You can use this API to get the stapled super fund of a newly joined payee. \nA payer-payee link needs to be established before using this API. \nIt can be established either by submitting a TFN Declaration or by submitting an STP pay-event.\n\n**This API has the following endpoints:**\n\n- `POST /`\nUse this endpoint to make the request for the stapled fund of a newly joined employee using the payer ABN or payer WPN.\n\n- `GET /{receipt}`\nUse this endpoint to get the outcome of a previously made stapled fund POST request using the payer ABN or payer WPN and returned receipt number.\n\nThe request for the stapled fund using the POST endpoints will be processed faster if TFN of the newly joined payee is provided.\nHowever, if TFN is not known (i.e. exempted TFN code is used) in the request, the response will return only a receipt number in the http header. You will have to make another call – using the GET endpoints – to get the request outcome using the receipt number received on the previous step.\nData for the GET call should become available in 5 minutes after the POST call.\n\nFor more in-depth information refer to the endpoint paths in the specifications below around the use of the endpoints \nand desired input path and query parameters.\n"
  version: 1.1.28
  x-status:
    status: Proposed
  title: Stapled Super Fund API
servers:
- url: https://{env}/super/v1/clients/{identifierType}/{identifierValue}/payees/TFN/*/stapledSuperFund
  description: Devtest Environment
  variables:
    identifierType:
      default: ABN
      enum:
      - ABN
      - WPN
      description: Identifier Type
    env:
      default: sandbox.api.ato.gov.au
      enum:
      - api.ato.gov.au
      - sandbox.api.ato.gov.au
security:
- ScopeAuth:
  - ato.super.stapledsuperfund.c,r
paths:
  /:
    post:
      tags:
      - Request Stapled Super Fund for Payee
      summary: "Use this endpoint to make a request for the stapled superannuation fund of a newly joined payee using the payer ABN \n"
      description: "You can use this endpoint to make a request for the stapled superannuation fund of a newly joined payee using the\npayer ABN. We can process the request faster if you provide the payee TFN and will respond back with the outcome near real-time.\nHowever, if you provide us an exempted TFN code, we will need more time to process the request.\nThe response header section will contain a receipt number.\nYou will have to make another call using the \n[\"Get Payee Stapled Super Fund for Receipt\"](https://apiportal.ato.gov.au/apis/106/specification#/Get%20Payee%20Stapled%20Super%20Fund%20for%20Receipt)\nto get the outcome using the receipt number.\n\nFollowing are the exempted TFN codes:\n\n-	`000000000`: Use this when the employee chose not to quote a TFN and has not claimed an exemption from quoting a TFN or does not fit any of the below categories\n-	`111111111`: Use this when the employee has applied for a TFN but hasn't received it yet\n-	`333333333`: Use this when the employee is under 18 years old, with no TFN, and earns less than the amount required to attract pay as you go (PAYG) withholding\n-	`444444444`: Use this when the employee is a recipient of social security, or a service pension or benefit\n"
      parameters:
      - $ref: '#/components/parameters/contextParam'
      - $ref: '#/components/parameters/umcParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StapledSuperFundRequest'
        description: Request stapled super fund details.
        required: true
      operationId: requestStapledSuperFundForPayeeWithAbn
      responses:
        "400":
          content:
            application/json:
              examples:
                BadRequestExample:
                  $ref: '#/components/examples/SchemaBadRequestResponse'
              schema:
                $ref: '#/components/schemas/ApiErrorsResponse'
          description: Bad Request
          headers:
            receipt:
              $ref: '#/components/headers/ReceiptHeader'
        "422":
          content:
            application/json:
              examples:
                TFNExemptionAddressResponseExample:
                  $ref: '#/components/examples/TFNExemptionAddressResponse'
              schema:
                $ref: '#/components/schemas/ApiErrorsResponse'
          description: UnprocessableEntity
          headers:
            receipt:
              $ref: '#/components/headers/ReceiptHeader'
        "200":
          content:
            application/json:
              examples:
                SMSFStapledSuperFundResponseExample:
                  $ref: '#/components/examples/SMSFStapledSuperFundResponse'
                NonSMSFStapledSuperFundResponseExample:
                  $ref: '#/components/examples/NonSMSFStapledSuperFundResponse'
              schema:
                $ref: '#/components/schemas/StapledSuperFundResponse'
          description: "OK. \n\nThe request was successfully processed.\n"
          headers:
            receipt:
              $ref: '#/components/headers/ReceiptHeader'
        "500":
          content:
            application/json:
              examples:
                InternalServerErrorExample:
                  $ref: '#/components/examples/InternalServerErrorResponse'
              schema:
                $ref: '#/components/schemas/ApiErrorsResponse'
          description: Internal Server Error
          headers:
            receipt:
              $ref: '#/components/headers/ReceiptHeader'
  /{receipt}:
    get:
      tags:
      - Get Payee Stapled Super Fund for Receipt
      summary: |
        Use this endpoint to fetch the outcome of a previously made request for stapled fund using the receipt number.
      description: "Use this endpoint to fetch the outcome of a previously made request for stapled fund. You will have to provide the receipt number of the original request along with the payee and the intermediary details. \n"
      operationId: requestStapledSuperFundForPayeeWithReceiptNumberAndAbn
      parameters:
      - $ref: '#/components/parameters/receiptParam'
      - $ref: '#/components/parameters/contextParam'
      responses:
        "400":
          content:
            application/json:
              examples:
                BadRequestExample:
                  $ref: '#/components/examples/PathBadRequestResponse'
              schema:
                $ref: '#/components/schemas/ApiErrorsResponse'
          description: Bad Request
        "422":
          content:
            application/json:
              examples:
                InvalidReceiptIdResponseExample:
                  $ref: '#/components/examples/InvalidReceiptIdResponse'
              schema:
                $ref: '#/components/schemas/ApiErrorsResponse'
          description: UnprocessableEntity
        "200":
          content:
            application/json:
              examples:
                SMSFStapledSuperFundResponseExample:
                  $ref: '#/components/examples/SMSFStapledSuperFundResponse'
                NonSMSFStapledSuperFundResponseExample:
                  $ref: '#/components/examples/NonSMSFStapledSuperFundResponse'
              schema:
                $ref: '#/components/schemas/StapledSuperFundResponse'
          description: "OK. \n\nThe request was successfully processed.\n"
        "500":
          content:
            application/json:
              examples:
                InternalServerErrorExample:
                  $ref: '#/components/examples/InternalServerErrorResponse'
              schema:
                $ref: '#/components/schemas/ApiErrorsResponse'
          description: Internal Server Error
components:
  securitySchemes:
    ScopeAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.evte.ato.gov.au/core2/connect/token
          scopes:
            ato.super.stapledsuperfund.c,r: Grants ability to POST and GET a Stapled Super Fund
  parameters:
    receiptParam:
      name: receipt
      in: path
      description: The receipt number for the super fund details interaction.
      required: true
      schema:
        type: string
        pattern: '[0-9]{13}'
        example: 6300000000001
    contextParam:
      name: context
      required: false
      in: query
      description: "\nThe `context` parameter specifies the ABN of the intermediary, the Tax Agent Number (TAN),\nor Registered Agent Number(RAN)\n\n-	When a payer is submitting request for its newly joined payee: context not required.\n-	When an intermediary that is not an agent is acting on behalf of the payer requesting\n  stapled super fund of the newly joined payee:\n  `context=\"ABN={abn_intermediary}\";` note the intermediary does not have a TAN or a RAN as it is not an agent\n-	When an agent is acting on behalf of the payer requesting stapled super fund of the newly joined payee,\n  TAN or RAN of the intermediary has to be provided in the context, e.g.: `context=\"TAN={TAN}\"` or `context=\"RAN={RAN}\"`.\n  \n"
      schema:
        type: string
      examples:
        tan:
          value: '"TAN=17801003"'
          summary: Tax agent – TAN
        ran:
          value: '"RAN=17801003"'
          summary: Tax agent – RAN
        abn_intermediary:
          value: '"ABN=18083973826"'
          summary: Intermediary that is not a tax agent
    umcParam:
      name: unableToMakeContribution
      required: false
      in: query
      description: "\nStapled super fund previously notified by the ATO cannot accept contributions. \nUse to indicate that employer is unable to make contributions to accounts previously notified in staple super fund request outcome.\n"
      schema:
        type: boolean
        example: true
  headers:
    ReceiptHeader:
      description: The receipt number for the super fund details interaction.
      schema:
        type: string
        pattern: '[0-9]{13}'
        example: 6300000000014
  examples:
    NonSMSFStapledSuperFundResponse:
      summary: Non SMSF Stapled Super Fund response
      description: Example Non SMSF Stapled Super Fund response
      value: |-
        {
          "data":{
            "requestOutcome": {
              "reasonCode": "Stapled fund"
            },
            "payee": {
              "payeePayrollId": "123456789",
              "personName": {
                "familyName": "Doe",
                "givenName": "John",
                "otherGivenName": "Louis Rey"
              }
            },
            "superfund": {
              "australianBusinessNumber": "12345678901",
              "organisationalName": "Australian Super Pty Ltd",
              "superannuationProduct": {
                "name": "Australian Super"
              },
              "superannuationFund": {
                "uniqueSuperannuationIdentifier": "STA0100AU",
                "memberAccount": "12345678901234"
              }
            }
            }
        }
    SMSFStapledSuperFundResponse:
      summary: SMSF Stapled Super Fund response
      description: Example SMSF Stapled Super Fund response
      value: |-
        {
          "data": {
            "requestOutcome": {
              "reasonCode": "Stapled SMSF"
            },
            "payee": {
              "payeePayrollId": "123456789",
              "personName": {
                "familyName": "Doe",
                "givenName": "John",
                "otherGivenName": "Louis Rey"
              }
            },
            "superfund": {
              "australianBusinessNumber": "12345678901",
              "organisationalName": "Australian Super Pty Ltd",
              "superannuationProduct": {
                "name": ""
              },
              "superannuationFund": {
                "uniqueSuperannuationIdentifier": "",
                "memberAccount": ""
              }
            }
          }
