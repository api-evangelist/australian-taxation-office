    InvalidReceiptIdResponse:
      summary: Invalid Receipt ID response
      description: Example invalid receipt id response
      value: |-
        {
          "errors": [
          {
            "code": "RSF.00006",
            "detail": "Receipt number provided is invalid.",
            "source": {
              "parameter": "receipt"
            }
          }
          ]
        }
    SchemaBadRequestResponse:
      summary: Schema Bad Request response
      description: Example Schema Bad Request response
      value: |-
        {
          "errors": [
          {
            "code": "RSF.00000",
            "detail": "regex '^[0-9]{4}$' does not match input string '12345'",
            "source": {
              "pointer": "/payee/addressResidential/postCode"
            }
          }
          ]
