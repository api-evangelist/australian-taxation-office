          type: array
    StapledSuperFund:
      description: This holds the stapled super fund details.
      properties:
        requestOutcome:
          $ref: '#/components/schemas/StapledFundRequestOutcome'
        payee:
          properties:
            personName:
              properties:
                familyName:
                  example: Martin
                  description: The person's last name or surname. The name by which a family group is identified.
                  type: string
                givenName:
                  example: Mark
