# x-archived-from: australian-taxation-office-oauth-dynamic-client-registration-openapi.yml
# x-archived-on: 2026-10-22
openapi: 3.0.0
info:
  description: |
    <p>The ATO’s Rest based APIs are protected with the OAuth protocol. As part of the OAuth standard, software applications are required to be registered with the Authorisation server. This API will register Digital Service Providers application instances with the ATO’s Authorisation server. The API is based on the <a href="https://www.rfc-editor.org/rfc/rfc7591">Dynamic Registration Protocol</a> and <a href="https://www.rfc-editor.org/rfc/rfc7592">Dynamic Client Registration Management Protocol</a>.</p>
  version: 1.0.69
  x-status:
    status: Active
  title: OAuth Dynamic Client Registration API
servers:
- url: https://{env}/idp/v1/relyingparties
  description: Production Environment
  variables:
    env:
      default: api.ato.gov.au
      enum:
      - api.ato.gov.au
      - sandbox.api.ato.gov.au
paths:
  /:
    post:
      tags:
      - Register a new software application instance
      summary: |
        Use this endpoint to register a new software application instance with ATO auth server
      description: |
        <p>You can use this endpoint to register a new software application instance with the ATO auth server. It is based on <a href="https://www.rfc-editor.org/rfc/rfc7591">OAuth 2.0 Dynamic Client Registration Standard</a>. </p>
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelyingParty'
        description: Contains the resource - RelyingParty - that represents the software application instance that has to be registered.
        required: true
      operationId: postClientRegistration
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelyingParty'
          description: "Created. \n\nThe request was successfully processed."
        "400":
          content:
            application/json:
              examples:
                BadRequestExample:
                  $ref: '#/components/examples/BadRequest'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request.
        "401":
          content:
            application/json:
              examples:
                BadRequestExample:
                  $ref: '#/components/examples/Unauthorised'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: |
            Unauthorized.
        "403":
          content:
            application/json:
              examples:
                BadRequestExample:
                  $ref: '#/components/examples/Forbidden'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden.
        "404":
          content:
            application/json:
              examples:
                BadRequestExample:
                  $ref: '#/components/examples/NotFound'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found.
components:
  securitySchemes:
    ScopeAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://auth.ato.gov.au/core2/connect/token
          scopes:
            ato.idp.relyingParties.c: Grants ability to register (POST) a new software application
  headers:
    ReceiptHeader:
      description: The receipt number for the client oauth registration.
      schema:
        type: string
        pattern: '[0-9]{13}'
        example: 6300000000014
  schemas:
    RelyingParty:
      properties:
        client_name:
          description: Human-readable string name of the client to be presented to the end-user during authorization.
          example: ExampleClient
          type: string
          maxLength: 256
        ato_api_key:
          description: API Key as defined by ATO DSG (Digital Services Gateway). Ensure it is same as the api key provided in the request header.
          example: t5h5qTIoynfDh54iq7zwRVILpo63hUm9
          type: string
          maxLength: 50
        x509_certificate:
          description: Base64 encoded x509 public certificate that will be used to verify private_key_jwt client assertions during client authentication. Either jwks_uri or x509_certificate, any one must be povided.
          example: 
          type: string
          maxLength: 8000
        grant_types:
          description: Array of OAuth 2.0 grant type strings that the client can use at the token endpoint. Grant type should be client_credentials for desktop service providers & urn:ietf:params:oauth:grant-type:jwt-bearer for cloud service providers.
          example:
          - client_credentials
          type: array
          items:
            type: string
            enum:
            - client_credentials
            - urn:ietf:params:oauth:grant-type:jwt-bearer
          maxItems: 1
        contacts:
          description: Ways to contact people responsible for this client, typically email addresses.
          example:
          - jane.citizen@example.com
          type: array
          items:
            type: string
            maxLength: 256
          nullable: true
          maxItems: 3
        software_id:
          description: A 32 length GUID (canonical) or 36 length GUID (non-canonical) unique identifier string assigned by the client developer or software publisher used by registration endpoint to identify the client software to be dynamically registered.
          example: ExampleApplication
          type: string
          nullable: true
          maxLength: 36
        software_version:
          description: A version identifier string for the client software identified by "software_id". The value of the "software_version" should change on any update to the client software identified by the same "software_id". The value of this field is intended to be compared using string equality matching and no other comparison semantics are defined by this specification.
          example: v1.0.0.1
          type: string
          nullable: true
          maxLength: 50
        client_id:
          description: Random value that uniquely identifies the client software at the ATO auth server and is set by the system as a result of registration. Its format is a flat string representation of a GUID.
          example: c04e4efa-0933-210e-97ae-cf0baffe304e
          type: string
          nullable: true
          readOnly: true
          maxLength: 36
        client_id_issued_at:
          description: Time at which the client identifier was issued.  The time is represented as the number of seconds from 1970-01-01T00:00:00Z as measured in UTC until the date/time of issuance and be set by the system at the time of registration.
          example: 2023-02-20T16:38:46.0000000
          type: string
          nullable: true
          readOnly: true
        registration_client_uri:
          description: String containing the fully qualified URL of the client configuration endpoint for this client.
          example: https://exampleclient.com/api/v1/registry/c04e4efa-0933-210e-97ae-cf0baffe304e
          type: string
          nullable: true
          readOnly: true
          maxLength: 2048
        registration_access_token:
          description: A long lived access token. String containing the access token to be used at the client configuration endpoint to perform subsequent operations upon the client registration. This token is initially generated while registering the client and will be updated during each applicable update.
          example: eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiIsIng1dCI6IjFTZ29aZ0xJM2h4YWFRMXQ2SVlQZW1IakY4TSIsImtpZCI6IkQ1MjgyODY2MDJDOERFMUM1QTY5MEQ2REU4ODYwRjdBNjFFMzE3QzMifQ..k4xkfXrQZhRehdEkaaDGVS7nvo0cguqyXB9xy2JrucM3A3Je_istT49J__38oKI35jS98bOx-vHMNLcSj9eJBCST1h7ddvTdASH0_JP27v_vCyeS9xdmq3JR80K0l0gbkUinP-kQErLjLyFCg3drx_t174NCh0k1DAlF70zYxBUk33i5P23eiPiMGtlV9Ylj1dISzyzLJwML5geMS8WFmx3EiWF6Yhr84su4F4c4YkVL6vL1uPBVQv-Zpd0AMD9WwgP38JVRzeLwE_s1oz9WrvX3xapCK-M0ARF_D0AfpV7FjN5URbCNktSLMc32tw_cDqj2gz_VgyKuaDmQ0zds-g
          type: string
          nullable: true
          readOnly: true
          maxLength: 8000
        scope:
          description: String containing a space-separated list of scope values that the client can use when requesting access tokens; it is a read only attribute and will be provided as part of response
          example: ato.smsfaliaslookup.providers.r ato.super.stapledsuperfund.c
          type: string
          nullable: true
          readOnly: true
          maxLength: 2000
        token_endpoint_auth_method:
          description: String indicator of the authentication method for the token endpoint. Currently we only support it to be of the type urn:ietf:params:oauth:client-assertion-type:jwt-bearer; it is a read-only attribute.
          example: urn:ietf:params:oauth:client-assertion-type:jwt-bearer
          type: string
          nullable: true
          readOnly: true
          maxLength: 2000
      required:
      - client_name
      - grant_types
      - x509_certificate
      - ato_api_key
    ErrorResponse:
      description: This will hold the response error details.
      type: object
      properties:
        error:
          description: The type of error that is returned.
          example: invalid_request
          type: string
          nullable: false
          enum:
          - invalid_request
          - invalid_token
          - insufficient_scope
        error_description:
          description: A human-readable explanation specific to this occurrence of the problem.
          example: The Authorization Token is invalid
          type: string
          nullable: true
      title: ErrorResponse
      required:
      - error
    ApiErrorsResponse:
      properties:
        errors:
          items:
            $ref: '#/components/schemas/ApiError'
          type: array
      description: ""
    ApiError:
      description: This will hold the API error details.
      type: object
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          example: regex '^[0-9]{4}$' does not match input string '12345'
          type: string
          nullable: true
        code:
          description: An application-specific error code.
          example: DSG.00000
          type: string
          nullable: true
      title: ApiError
  examples:
    BadRequest:
      summary: Bad Request
      description: Example of an invalid request
      value: |-
        {
          "error": "invalid_request",
          "error_description": "invalid request"
        }
    Unauthorised:
      summary: Unauthorised
      description: Example of an unauthorised response due to invalid token
      value: |-
        {
          "error": "invalid_token",
          "error_description": "The Authorization Token is invalid"
        }
    Forbidden:
      summary: Forbidden
      description: Example of a forbidden response due to insufficient scope(s) provided in the request body
      value: |-
        {
          "error": "insufficient_scope",
          "error_description": "entity is not enabled for one or more requested scopes"
        }
    NotFound:
      summary: Not Found
      description: Example response for a resource that does not exist
      value: |-
        {
          "errors": [
            {
              "code": "DSG.00000",
              "detail": "No API path found that matches request '{entered_API_Path}'"
            }
          ]
        }

