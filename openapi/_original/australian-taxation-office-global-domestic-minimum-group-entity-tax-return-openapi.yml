        postCode:
          description: |
            The descriptor for a postal delivery area, aligned with locality, suburb or place. Can be used for an Australian or non-Australian address.
          type: string
          example: 3000
      required:
        - line1
        - localityName
        - countryCode
    DomesticMinimumTaxReturn:
      description: |
        Will contain whether the group entity has to report domestic top up tax and if so what that amount is.

        **Note - This object only needs to be present in the request if `continueGlobalDomesticMinimumReturnIndicator` is set to `true`.
        Otherwise, you can skip passing in details for this object.**
      properties:
        domesticTopUpTaxIndicator:
          description: |
            Indicate whether the group entity has the obligation to report a domestic top up tax amount.

             - If `domesticTopUpTaxIndicator` is set to false then there will be no need to pass any Domestic Top-up Tax Amount in the request.
          type: boolean
          example: true
        domesticTopUpTaxAmount:
          description: |
            The domestic top up tax amount for the group entity. If the amount is nil, please enter '0' in the field.

            **Note - This field only needs to be present in the request if the answer to `domesticTopUpTaxIndicator` is set to `true`. 
          type: integer
          nullable: true
          example: 3000
          minimum: 0
          maximum: 99999999999
      required:
        - domesticTopUpTaxIndicator
    IncomeInclusionRuleReturn:
      description: |
        Will contain whether the group entity has to report IIR top up tax and if so what that amount is and the parent entity type subject to the tax.

        **Note - This object only needs to be present in the request if `continueGlobalDomesticMinimumReturnIndicator` is set to `true`.
        Otherwise, you can skip passing in details for this object.**
      properties:
        incomeInclusionTopUpTaxIndicator:
          description: |
            Indicate whether the group entity has the obligation to report a IIR top up tax amount.

             - If `incomeInclusionTopUpTaxIndicator` is set to false then there will be no need to pass any IIR Top-Up Tax Amount and 
             associated parent entity in the request.
          type: boolean
          example: true
        incomeInclusionTopUpTaxAmount:
          description: |
            The IIR top up tax amount for the group entity. If the amount is nil, please enter '0' in the field.

            Note - This field only needs to be present in the request if the answer to `incomeInclusionTopUpTaxIndicator` is set to `true`.
          type: integer
          nullable: true
          example: 2000
          minimum: 0
          maximum: 99999999999
        parentEntityType:
          description: |
            The parent entity type of the group entity subject to the IIR tax.

            Note - This field only needs to be present in the request if the answer to `incomeInclusionTopUpTaxIndicator` is set to `true`. 

            **Parent Entity Type Description Table**
            |Parent Entity Type Code| Description                   |
            |-----------------------|-------------------------------|
            |UPE                    | Ultimate parent entity        |
            |IPE                    | Intermediate parent entity    |
            |POPE                   | Partially owned parent entity |

          type: string
          example: UPE
          enum:
            - UPE
            - IPE
            - POPE
      required:
        - incomeInclusionTopUpTaxIndicator
    UndertaxedProfitRuleReturn:
      description: |
        Will contain whether the group entity has to report UTPR top up tax and if so what that amount is.

        **Note - This object only needs to be present in the request if `continueGlobalDomesticMinimumReturnIndicator` is set to `true`
        and `periodStartDate` is on or after 01/01/2025. Otherwise, you can skip passing in details for this object.**
      properties:
        undertaxedProfitsTopUpTaxIndicator:
          description: |
            Indicate whether the group entity has the obligation to report a UTPR top up tax amount.

             - If `undertaxedProfitsTopUpTaxIndicator` is set to false then there will be no need to pass any UTPR Top-up Tax Amount in the request.
          type: boolean
          example: true
        undertaxedProfitsTopUpTaxAmount:
          description: |
            The UTPR top up tax amount for the group entity. If the amount is nil, please enter '0' in the field.

            Note - This field only needs to be present in the request if the answer to `undertaxedProfitsTopUpTaxIndicator` is set to `true`.
          type: integer
          example: 2500
          minimum: 0
          maximum: 99999999999
      required:
        - undertaxedProfitsTopUpTaxIndicator
    GroupEntityAssociateDetails:
      description: |
        This will hold the speific information related to the primary associate entity for the group entity. 

        **Note the `groupEntityAssociateDetails` information will not need to be passed
        if `groupEntityType` is passed in as any of the below options:**

        - `Company`

        - `Main Entity of a GloBE Permanenet Establishment that is a Company`

        - `GloBE Joint Venture`

      properties:
        associateEntityName:
          description: |
            This is the full name of the associate entity
          type: string
          example: "Test Pillar 2 Ltd"
          maxLength: 200
          pattern: ^(?![Nn] [Aa]$|[Nn]\'[Aa]$|[Aa]\/[Aa]$|[Nn]\/[Aa]$|[Nn] \/ 
            [Aa]$|[Nn]\/\s[Aa]$|[Nn]\s\/[Aa]$)[A-Za-z0-9 
            ,-`!@#$%\&()_=\[\]\{\}\|\;:'"\\.\?\/\-]*$
        taxFileNumber:
          description: |
            This is the tax file number of the associate entity
          type: string
          minLength: 8
          maxLength: 9
          nullable: true
          example: 111111111
        telephoneAreaCode:
          description: |
            Telephone area code of the associate entity.
          type: string
          minLength: 2
          maxLength: 4
          pattern: ^\d+$
          example: "02"
        telephoneNumber:
          type: string
          description: |
            This is the phone number of the associate entity.
          minLength: 7
          maxLength: 15
          pattern: ^\d+$
        postalAddress:
          description: |
            This is the postal address of the assciate entity.
          $ref: '#/components/schemas/Address'
      required:
        - associateEntityName
        - telephoneAreaCode
        - telephoneNumber
        - postalAddress
    GlobalDomesticMinimumGroupEntityTaxReturnResponse:
      description: This is the response for the Combined Global and Domestic 
        Minimum Group Entity Tax Return when successfully submitted.
      properties:
        data:
          $ref: '#/components/schemas/GlobalDomesticGroupEntityForm'
      required:
        - data
    GlobalDomesticGroupEntityForm:
      description: This is the response data for a successfully submitted Group 
        Entity Combined Global and Domestic Tax Return
      properties:
        message:
          description: |
            Response message to let the lodger know their lodgment was successful.
          type: string
          example: "The Combined Global and Domestic Minimum Tax Return was successfully
            submitted."
        date:
          description: |
            Timestamp for when the lodgement was completed.
          type: string
          format: date-time
          example: "2025-06-30T12:30:00+10:00"
        entityName:
          description: |
            The name of the group entity which form was lodged for.
          type: string
          example: "Mark Martin"
        australianBusinessNumber:
          description: |
            This is the ABN of the group entity and will be returned if applicable for the group entity.
          type: string
          nullable: true
          example: "12345678901"
        paymentAmount:
          description: |
            This is the total amount of liabilities the group entity has to pay. 
          type: integer
          example: 1450
        paymentReferenceNumber:
          description: |
            This is the payment reference number for this group entity. Will be returned if there is an amount to be paid.
          type: string
          nullable: true
          example: "123456789098765432"
      required:
        - message
        - date
        - entityName
        - paymentAmount
    ApiError:
      description: This will hold the response error details.
      type: object
      properties:
        detail:
          description: A human-readable explanation specific to this occurence 
            of the problem.
          example: Object has missing required properties (['periodStartDate'])
          type: string
          nullable: true
        code:
          description: An application specific error code
          example: OAS.VAL.00000
          type: string
          nullable: true
        source:
          $ref: '#/components/schemas/Source'
    Source:
      description: An object containing references to the source of the error.
      type: object
      properties:
        pointer:
          description: JSON Pointer [RFC6901] to the associated entity in the 
            request document.
          example: /groupEntityDetails/groupEntityName
          type: string
          nullable: true
        parameters:
          description: A string indicating which URI query parameter caused the 
            error.
          example: context
          type: string
          nullable: true
    ApiErrorsResponse:
      description: Full error payload returned to client. Will contain multiple 
        errors if there are multiple that get returned.
      properties:
        errors:
          items:
            $ref: '#/components/schemas/ApiError'
          type: array
