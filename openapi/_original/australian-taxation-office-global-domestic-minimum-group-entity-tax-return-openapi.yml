# x-archived-from: australian-taxation-office-global-domestic-minimum-group-entity-tax-return-openapi.yml
# x-archived-on: 2026-10-22
openapi: 3.0.0
info:
  title: Global and Domestic Minimum Group Entity Tax Return API
  description: |-
    The Global and Domestic Minimum Group Entity Tax Return API enables software users to lodge a 
    Combined Global and Domestic Minimum Tax Return on behalf of a group entity within their multi-national enterprise (MNE) group.
  version: 1.1.60
  x-status:
    status: Proposed
servers:
  - url: 'https://{env}/combinedMinimumGlobalDomesticReturn/v1'
    description: |
      Global and Domestic Minimum Group Entity Tax Return
    variables:
      env:
        default: api.ato.gov.au
        description: |
          This is the environment that is going to be used to hit the API
        enum:
          - sandbox.api.ato.gov.au
          - api.ato.gov.au
paths:
  /clients/ABN/{identifierValue}/globalDomesticReturn/{transactionID}/groupEntity:
    post:
      tags:
        - Combined Global and Domestic Group Entity Tax Return
      summary: This endpoint will allow you to either lodge or amend a Combined 
        Global and Domestic Minimum Tax Return on behalf of a group entity.
      description: |
        This API is to support the digital lodgement of tax returns for group entities that are subject to Australia's implementation of the OECD's Global Anti-Base 
        Erosion (GloBE) rules. It facilitates the reporting of obligations under the following components:

        1. Australian Income Inclusion Rule (IIR)
           Applies a top-up tac on Australian parent entities if the group's effective tax rate in another jurisdiction is below 15%.

        2. Australian Undertaxed Profits Rule (UTPR)
           Acts as a backstop to the IIR, applying a top-ip tax on Australian group entities when profits are not taxed under the IIR.

        3. Australian Domestic Minimum Top-up (DMT) Tax
           Ensures Australia retains primary taxing rights over low-taxed profits within its jurisdiction, consistent with the GloBE rules.

        **Effective Dates**

        - The IIR and DMT apply to fiscal years starting on or after 1 January 2024
        - The UTPR applies to fiscal years starting on or after 1 January 2025.
      parameters:
        - $ref: '#/components/parameters/contextParam'
        - $ref: '#/components/parameters/transactionID'
        - $ref: '#/components/parameters/identifierValue'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalDomesticMinimumGroupEntityTaxReturnRequest'
        description: Request for lodging or amending the Combined Global and 
          Domestic Minimum Tax Return on behalf on a group entity
        required: true
      operationId: requestGlobalDomesticGroupEntityTaxReturnForm
      responses:
        '202':
          description: Successful Response from Combined Global and Domestic 
            Minumum Group Entity Tax Return
          headers:
            receipt:
              description: This is the BET transaction ID that is associated 
                with the submitted form. This will be passed into subsequent API
                call to retrieve the PRN for this group entity.
              schema:
                type: string
                pattern: '[0-9]{13}'
                example: "6300000000001"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalDomesticMinimumGroupEntityTaxReturnResponse'
              examples:
                GlobalDomesticMinimumGroupEntityTaxReturnResponse:
                  $ref: '#/components/examples/GlobalDomesticMinimumGroupEntityTaxReturnResponse'
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorsResponse'
              examples:
                BadRequestExample:
                  $ref: '#/components/examples/SchemaBadRequestResponse'
          description: Bad Request Response
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorsResponse'
              examples:
                ApiKeyInvalidExample:
                  $ref: '#/components/examples/ApiKeyInvalidResponse'
                InvalidCredentialExample:
                  $ref: '#/components/examples/InvalidCredentialResponse'
          description: Unauthorized Error responses
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorsResponse'
              examples:
                ForbiddenErrorExample:
                  $ref: '#/components/examples/ForbiddenErrorExample'
          description: Forbidden Access Error Response
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorsResponse'
              examples:
                UnprocessableEntityExample:
                  $ref: '#/components/examples/UnprocessableEntityResponse'
          description: Unprocessable Entity Response
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorsResponse'
              examples:
                InternalServerErrorExample:
                  $ref: '#/components/examples/InternalServerErrorResponse'
          description: Internal Server Error Response
components:
  parameters:
    contextParam:
      name: context
      required: false
      in: query
      style: deepObject
      explode: false
      description: |2

        The `context` parameter specifies the Registered Agent Number (RAN)

        - When a client is submitting a request to lodge or amend the Combined Global and Domestic Minimum tax return for a group entity: `context` is not required
        - When an agent is acting on behalf of the client to lodge or amend the Combined Global and Domestic Minimum Tax Return for a group entity the
        TAN or RAN of the intermediary has to be provided in the context, e.g.: `context[TAN]={TAN}` or `context[RAN]={RAN}`.
      schema:
        type: deepObject
        $ref: '#/components/schemas/context'
      examples:
        RAN:
          summary: Tax Agent - RAN
          value: ?context[RAN]=17801003
        TAN:
          summary: Tax Agent - TAN
          value: ?context[TAN]=17801003
    identifierValue:
      name: identifierValue
      required: true
      in: path
      description: This will be the value of the identifier being passed in. 
        This is to be passed in the URI path.
      schema:
        type: string
        pattern: ^[0-9]{9,11}$
        maxLength: 11
    transactionID:
      name: transactionID
      required: true
      in: path
      description: This will be the receipt Transaction ID you received from the
        successful submission of the CGDMTR using Global and Domestic Minimum 
        Tax Return API. Ensure to pass this into the URI.
      schema:
        type: string
        pattern: '[0-9]{13}'
        example: "6300000000001"
  schemas:
    context:
      oneOf:
        - $ref: '#/components/schemas/TANContext'
        - $ref: '#/components/schemas/RANContext'
    TANContext:
      type: object
      required:
        - TAN
      properties:
        TAN:
          type: string
    RANContext:
      type: object
      required:
        - RAN
      properties:
        RAN:
          type: string
    GlobalDomesticMinimumGroupEntityTaxReturnRequest:
      properties:
        reportingFiscalYear:
          $ref: '#/components/schemas/ReportingFiscalYear'
        groupEntity:
          $ref: '#/components/schemas/GroupEntity'
      required:
        - reportingFiscalYear
        - groupEntity
    ReportingFiscalYear:
      description: |
        This will hold the start and end date of the fiscal year that the Combined Global and Domestic Tax Return is lodged for.
      properties:
        periodStartDate:
          description: |
            This is the start date of the fiscal year the Combined Global and Domestic Tax Return is lodged for.
          type: string
          format: date
          example: "2024-01-01"
        periodEndDate:
          description: |
            This is the end date of the fiscal year the Combined Global and Domestic Tax Return is lodged for.
          type: string
          format: date
          example: "2024-06-30"
        transactionTypeCode:
          description: |
            This will hold the transaction type of the parent form whether it is an original or amended form.

              **Transaction Type Description Table**
            |Transaction Type Code| Description                                                                                                       |
            |---------------------|-------------------------------------------------------------------------------------------------------------------|
            |ORIGINAL             | Select this for submitting an original lodgment of the Combined Global and Domestic Minimum Tax Return            |
            |AMENDMENT            | Select this for submitting an amendment to update the previously submitted information.                           |
          type: string
          enum:
            - ORIGINAL
            - AMENDMENT
      required:
        - periodStartDate
        - periodEndDate
        - transactionTypeCode
    GroupEntity:
      description: |
        This will hold the information related to the group entity.
      properties:
        groupEntityName:
          description: |
            This is the full name of the group entity.
          type: string
          example: "Test Pillar 2 Ltd"
          maxLength: 200
          pattern: ^(?![Nn] [Aa]$|[Nn]\'[Aa]$|[Aa]\/[Aa]$|[Nn]\/[Aa]$|[Nn] \/ 
            [Aa]$|[Nn]\/\s[Aa]$|[Nn]\s\/[Aa]$)[A-Za-z0-9 
            ,-`!@#$%\&()_=\[\]\{\}\|\;:'"\\.\?\/\-]*$
        groupEntityType:
          description: |
            This is the entity type for the group entity that the Combined Global and Domestic Minimum Tax Return is being lodged for.

            **Entity Type Description Table**
            |Entity Type Code| Description                                                                                            |
            |----------------|--------------------------------------------------------------------------------------------------------|                                                                                     
            |COMPY           | Company                                                                                                |
            |GPRTN           | GloBE partnership                                                                                      |
            |TRUST           | Trust                                                                                                  |
            |MCOMP           | Main entity of a GloBE permanent establishment that is a company                                       |
            |NCOMP           | Main entity of a GloBE permanent establishment that is not a company                                   |
            |JVOTH           | GloBE joint venture                                                                                    |
            |JVPRT           | Unincorporated GloBE joint venture that is a GloBE partnership                                         |
            |JVNTP           | Unincorporated GloBE joint venture that is not a trust or GloBE partnership                            |
            |JSPRT           | Unincorporated GloBE joint venture subsidiary where the subsidiary is a GloBE partnership              |
            |JSNTP           | Unincorporated GloBE joint venture subsidiary where the subsidiary is not a trust or GloBE partnership |
            |UENTP           | Unincorporated Group Entity that is not a trust or a GloBE partnership                                 |

          type: string
          example: COMPY
          enum:
            - COMPY
            - GPRTN
            - TRUST
            - MCOMP
            - NCOMP
            - JVOTH
            - JVPRT
            - JVNTP
            - JSPRT
            - JSNTP
            - UENTP
        identifierDetails:
          description: |
            At least one of the following identifiers are to be provided TFN/ABN/ARN. If providing both TFN and ABN make sure
            this is for the same group entity.
          type: array
          items:
            $ref: '#/components/schemas/IdentifierDetails'
        businessAddress:
          description: |
            This is the business address of the group entity.
          allOf:
            - $ref: '#/components/schemas/Address'
        foreignLodgementNotificationIndicator:
          description: |
            This is to indicate whether the lodger has lodged the Foreign Lodgment Notification on behalf of this group entity.
          type: boolean
          example: true
        continueGlobalDomesticMinimumReturnIndicator:
          description: |
            This is to indicate whether the lodger will complete the Australian IIR/UTPR and Australian DMT Tax Return on behalf of this group entity.
          type: boolean
          example: true
        domesticMinimumTaxReturn:
          $ref: '#/components/schemas/DomesticMinimumTaxReturn'
        incomeInclusionRuleTaxReturn:
          $ref: '#/components/schemas/IncomeInclusionRuleReturn'
        undertaxedProfitRuleTaxReturn:
          $ref: '#/components/schemas/UndertaxedProfitRuleReturn'
        groupEntityAssociateDetails:
          $ref: '#/components/schemas/GroupEntityAssociateDetails'
      required:
        - groupEntityName
        - businessAddress
        - identifierDetails
        - groupEntityType
        - foreignLodgementNotificationIndicator
        - continueGlobalDomesticMinimumReturnIndicator
    IdentifierDetails:
      properties:
        identifierType:
          description: |
            This will hold the different identifying type information for the group entity in this return.
          type: string
          enum:
            - TFN
            - ABN
            - ARN
        identifierValue:
          type: string
          description: |
            This will hold the value of the type of identifier selected in identifierType.
          minLength: 5
          maxLength: 200
          pattern: ^[A-Za-z0-9 `!@%#\$&()_\-=\[\]\{\}\\|;:'",\.\/\?]+$
      required:
        - identifierType
        - identifierValue
    Address:
      description: |
        This will hold the specific information relating to the address of the group entity lodging the Combined Global and Domestic Tax Return. Can be either the Business or Postal Address Details.
      properties:
        line1:
          description: |
            First line of address using free form format, that is used to create a semi structured address.
          type: string
          example: 34 wanderer street
          pattern: ^(?!unknown$|as\s*above$)(?!c\/o|c\/|care\s*of)[a-zA-Z0-9 
            !@$%&*()\-\=\[\]:;'",.?\/]+$
        line2:
          description: |
            Second line of address using free form format, that is used to create a semi structured address.
          type: string
          example: Unit 8
          nullable: true
          pattern: ^(?!unknown$|as\s*above$)(?!c\/o|c\/|care\s*of)[a-zA-Z0-9 
            !@$%&*()\-\=\[\]:;'",.?\/]+$
        localityName:
          description: |
            A word or combination of words, by which a geographic locality/suburb is designated or known.
          type: string
          example: Mt Helen
          pattern: ^(?!unknown$)[a-zA-Z0-9 !@$%&*()\-\=\[\]:;'",.?\/]+$
        stateOrTerritoryCode:
          description: |
            The code that is assigned to each Australian State or Territory
          type: string
          example: VIC
          nullable: true
          enum:
            - ACT
            - NSW
            - NT
            - QLD
            - SA
            - TAS
            - VIC
            - WA
        countryCode:
