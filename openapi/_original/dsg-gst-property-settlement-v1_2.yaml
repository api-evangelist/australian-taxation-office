    PurchaserName:
      type: object
      properties:
        givenName:
          type: string
          description: |
            First given name
          maxLength: 40
          pattern: ^[A-Za-z0-9' -]+$
          example: "John"
        otherGivenName:
          type: string
          description: |
            Middle name
          maxLength: 40
          example: "Douglas"
        familyName:
          description: |
            Family name
          type: string
          maxLength: 40
          pattern: ^[A-Za-z0-9' -]+$
          example: "Doe"

      required:
        - givenName
        - familyName

    PersonName:
      type: object
      properties:
        givenName:
          type: string
          description: |
            First given name
          maxLength: 40
          pattern: ^[A-Za-z0-9' -]+$
          example: "John"
        familyName:
          description: |
            Family name
          type: string
          maxLength: 40
          pattern: ^[A-Za-z0-9' -]+$
          example: "Doe"
      required:
        - givenName
        - familyName

    Address:
      type: object
      properties:
        line1:
          type: string
          maxLength: 38
          description: |
            Address Line 1

            First line utilising free format, that is used to create a semi structured address.
          pattern: ^[A-Za-z0-9&’'\/\-\(\) ]+$
          example: "Unit 12"
        line2:
          type: string
          maxLength: 38
          description: |
            Address Line 2

            Second line utilising free format, that is used to create a semi structured address.
          pattern: ^[A-Za-z0-9&’'\/\-\(\) ]+$
          example: "88 Sample Road"
        localityName:
          type: string
          maxLength: 46
          description: |
            Suburb/Town/Locality

            A word or combination of words, by which a geographic locality/suburb is designated or known.
          pattern: ^[A-Za-z&’'\/\-,() ]+$
          example: "Richmond"
        stateOrTerritory:
          type: string
          maxLength: 3
          enum:
            - ACT
            - NSW
            - NT
            - QLD
            - SA
            - TAS
            - VIC
            - WA
          description: |
            State of Territory

            Select a valid state or territory code for Australian address.
          example: "VIC"
        postCode:
          type: string
          maxLength: 12
          description: |
            Postcode

            The descriptor for a postal delivery area, aligned with locality, suburb or place. Can be used for an Australian address.
          pattern: ^[A-Za-z0-9 -]+$
          example: "3121"

        
      required:
        - line1
        - localityName

    BirthDate:
      type: object
      description: |
