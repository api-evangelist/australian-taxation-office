    Supplier:
      type: object
      description: |
        This will hold all information of a supplier.
      properties:
        entityType:
          type: string
          description: |
            This is the Entity Type of the supplier who can be an individual or non-individual like a company.
          enum:
            - INDIVIDUAL
            - NON-INDIVIDUAL
          example: NON-INDIVIDUAL
        entityName:
          type: string
          maxLength: 200
          description: |
            If the supplier is a non-individual entity, provide the Supplier's Entity Name in full.
          pattern: ^[A-Za-z0-9 `!@%#\$&()_\-=\[\]\{\}\\|;:'",\.\/\?]+$
          example: "Dummy Seller Pty Ltd"
        personName:
          $ref: "#/components/schemas/PersonName"
        australianBusinessNumber:
          type: string
          maxLength: 11
          description: |
            Australian Business Number of the supplier
          pattern: ^[0-9]+$
          example: "2794521038"
        gstBranchNumber:
          type: string
          maxLength: 3
          description: |
            GST branch number
          pattern: ^[0-9]+$
          example: "101"
        representativeName:
          type: string
          maxLength: 200
          description: |
            Supplier's representative
          pattern: ^[A-Za-z0-9 \-`!@%#\$&\(\)_=\[\]\{\}\\\|;:'",\.\?\/]+$
          example: "Property Sellers Pty Ltd"
        telephoneAreaCode:
          type: string
          maxLength: 4
          description: |
            This is the supplier's telephone area code
          pattern: ^[0-9]+$
          example: "03"
        telephoneNumber:
          type: string
          maxLength: 15
          description: |
            This is the supplier's telephone number.

            Enter the supplier's phone number with area code or mobile number – don't include brackets or spaces in your entry.
