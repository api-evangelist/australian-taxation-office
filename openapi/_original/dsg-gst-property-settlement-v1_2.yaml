      properties:
        birthDay:
          type: integer
          minimum: 1
          maximum: 31
          description: |
            This is the day in which an individual was born.
          example: 15
        birthMonth:
          type: integer
          minimum: 1
          maximum: 12
          description: |
            This is the month in which an individual was born.
          example: 8
        birthYear:
          type: integer
          minimum: 1800
          maximum: 9999
          description: |
            This is the year in which an individual was born.
          example: 1973
      required:
        - birthDay
        - birthMonth
        - birthYear

