openapi: 3.0.0
info:
  title: GST Property Settlement API
  description: |
    The GST Property Settlement API allows software users to lodge Form one: GST property settlement withholding notification and Form two: GST property settlement date confirmation directly to the Australian Taxation Office (ATO).

    Form one notifies the ATO that a purchaser has entered a contract of sale and has a withholding obligation. You can complete and lodge Form one any time after the contract has been entered into and you have a written notification from your supplier. The form must be lodged by the due date for payment of the withholding amount – this is usually settlement date or the first instalment date.

    Form two confirms your settlement date and establishes a purchaser withholding account, where the purchaser withholding liability is recorded until payment is made. You can complete and lodge Form two for:

    - a standard land contract, either:
      - within 2 business days before settlement
      - on the day of settlement
      - on the next business day after settlement
    - an instalment contract
      - when the first instalment is paid.

  version: 1.0.1
  termsOfService: https://apiportal.ato.gov.au/conditions-use
  x-status:
    status: Proposed
  contact:
    name: ATO Digital Partnership Office
    email: DPO@ato.gov.au

servers:
  - url: https://{env}/propertySettlementGoodsServicesTax/v1
    description: |
      GST Property Settlements
    variables:
      env:
        default: api.ato.gov.au
        description: |
          this is the environment that is going to be used to hit the API
        enum:
          - sandbox.api.ato.gov.au
          - api.ato.gov.au
security:
  # both M2M bearer token and apikey are required together
  - ScopeAuth:
      - ato.apGSTPropertySettlement
  - ApiKeyAuth: []

paths:
  /clients/ABN/{identifierValue}/propertySettlements:
    post:
      parameters:
        - $ref: '#/components/parameters/identifierValue'

      tags:
        - GST Property Settlement Withholding Notification
      summary: This endpoint will allow you to submit a GST Property Settlement 
        Withholding Notification.
      description: |
        This endpoint validates your payload and, if it passes all checks, lodges the GST property settlement withholding notification with the ATO. 

        Ensure the request data is correct before submitting. 

      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GSTPropertySettlementWithholdingNotificationRequest"
            examples:
              Representative:
                $ref: '#/components/examples/WithholdingNotificationRepresentative'
        required: true
      responses:
        "201":
          $ref: "#/components/responses/201WithholdingNotificationSubmitSuccessResponse"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "404":
          $ref: "#/components/responses/404ErrorResponse"
        "405":
          $ref: "#/components/responses/405ErrorResponse"
        "406":
          $ref: "#/components/responses/406ErrorResponse"
        "415":
          $ref: "#/components/responses/415ErrorResponse"
        "422":
          $ref: "#/components/responses/422ErrorResponse"
        "429":
          $ref: "#/components/responses/429ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
        "503":
          $ref: "#/components/responses/503ErrorResponse"
        "504":
          $ref: "#/components/responses/504ErrorResponse"
  /clients/ABN/{identifierValue}/propertySettlements/validationResults:
    post:
      parameters:
        - $ref: '#/components/parameters/identifierValue'
      tags:
        - GST Property Settlement Withholding Notification
      summary: This endpoint will allow you to validate the lodgment data for 
        GST Property Settlement Withholding Notification.
      description: |
        This endpoint performs validation only.

        The API returns validation errors if present; otherwise, the payload is valid and no lodgment or downstream processing is performed.      
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GSTPropertySettlementWithholdingNotificationRequest"
            examples:
              Representative:
                $ref: '#/components/examples/WithholdingNotificationRepresentative'
        required: true
      responses:
        "204":
          $ref: "#/components/responses/204ValidateSuccessResponse"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "404":
          $ref: "#/components/responses/404ErrorResponse"
        "405":
          $ref: "#/components/responses/405ErrorResponse"
        "406":
          $ref: "#/components/responses/406ErrorResponse"
        "415":
          $ref: "#/components/responses/415ErrorResponse"
        "422":
          $ref: "#/components/responses/422ErrorResponse"
        "429":
          $ref: "#/components/responses/429ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
        "503":
          $ref: "#/components/responses/503ErrorResponse"
        "504":
          $ref: "#/components/responses/504ErrorResponse"
  /clients/ABN/{identifierValue}/changeOfPropertySettlements:
    post:
      parameters:
        - $ref: '#/components/parameters/identifierValue'
      tags:
        - GST Property Settlement Date Confirmation
      summary: This endpoint will allow you to submit a GST Property Settlement 
        Date Confirmation.
      description: |
        This endpoint validates your payload and, if it passes all checks, lodges the GST property settlement date confirmation with the ATO. 

        Ensure the request data is correct before submitting. 

      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GSTPropertySettlementDateConfirmationRequest"
            examples:
              Representative:
                $ref: '#/components/examples/DateConfirmationRepresentative'
        required: true
      responses:
        "204":
          $ref: "#/components/responses/204DateConfirmationSubmitSuccessResponse"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "404":
          $ref: "#/components/responses/404ErrorResponse"
        "405":
          $ref: "#/components/responses/405ErrorResponse"
        "406":
          $ref: "#/components/responses/406ErrorResponse"
        "415":
          $ref: "#/components/responses/415ErrorResponse"
        "422":
          $ref: "#/components/responses/422ErrorResponse"
        "429":
          $ref: "#/components/responses/429ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
        "503":
          $ref: "#/components/responses/503ErrorResponse"
        "504":
          $ref: "#/components/responses/504ErrorResponse"
  /clients/ABN/{identifierValue}/changeOfPropertySettlements/validationResults:
    post:
      parameters:
        - $ref: '#/components/parameters/identifierValue'
      tags:
        - GST Property Settlement Date Confirmation
      summary: This endpoint will allow you to validate the lodgment data for 
        GST Property Settlement Date Confirmation.
      description: |
        This endpoint performs validation only.

        The API returns validation errors if present; otherwise, the payload is valid and no lodgment or downstream processing is performed.      

      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GSTPropertySettlementDateConfirmationRequest"
            examples:
              Representative:
                $ref: '#/components/examples/DateConfirmationRepresentative'
      responses:
        "204":
          $ref: "#/components/responses/204ValidateSuccessResponse"
        "400":
          $ref: "#/components/responses/400ErrorResponse"
        "401":
          $ref: "#/components/responses/401ErrorResponse"
        "403":
          $ref: "#/components/responses/403ErrorResponse"
        "404":
          $ref: "#/components/responses/404ErrorResponse"
        "405":
          $ref: "#/components/responses/405ErrorResponse"
        "406":
          $ref: "#/components/responses/406ErrorResponse"
        "415":
          $ref: "#/components/responses/415ErrorResponse"
        "422":
          $ref: "#/components/responses/422ErrorResponse"
        "429":
          $ref: "#/components/responses/429ErrorResponse"
        "500":
          $ref: "#/components/responses/500ErrorResponse"
        "503":
          $ref: "#/components/responses/503ErrorResponse"
        "504":
          $ref: "#/components/responses/504ErrorResponse"


components:
  parameters:
    identifierValue:
      name: identifierValue
      required: true
      in: path
      description: |
        This will be the value of the ABN being passed which must be the same ABN used to generate the Access Token to call the API. 

        This is to be passed in the URI path.
      schema:
        type: string
        pattern: ^[0-9]{9,11}$
        maxLength: 11
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: apikey
      description: |
        API key is assigned when you register to the ATO API Portal.  

        See more details about the registration process in **[Getting started | ATO API Portal](https://apiportal.ato.gov.au/getting-started#toc-how-to-start-using-our-api-portal-services)**.
    ScopeAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: '{env}/core2/connect/token'
          scopes:
            ato.apGSTPropertySettlement: Grants ability to lodge GST on Property
              Settlement Forms
  schemas:
    ApiErrorsResponse:
      description: |
        Full error payload returned to client. Will contain multiple errors if there are multiple that get returned.
      properties:
        errors:
          items:
            $ref: "#/components/schemas/ApiError"
          type: array

    ApiError:
      title: ApiError
      type: object
      properties:
        detail:
          type: string
          description: |
            A human-readable explanation specific to this occurrence of the problem.
          nullable: true
        code:
          type: string
          description: |
            An application-specific error code.
          nullable: true
        source:
          $ref: "#/components/schemas/Source"
      description: |
        This will hold the response error details.

    Source:
      title: Source
      type: object
      properties:
        pointer:
          type: string
          description: "JSON Pointer [RFC6901] to the associated entity in the request
            document."
          nullable: true
        parameter:
          type: string
          description: |
            A string indicating which URI query parameter caused the error.
          nullable: true
      description: |
        An object containing references to the source of the error.

    GSTPropertySettlementWithholdingNotificationRequest:
      description: |
        This object will hold the data of the request payload of GST Property Settlement Withholding Notification.
      type: object
      properties:
        data:
          $ref: '#/components/schemas/GSTPropertySettlementWithholdingNotification'
    GSTPropertySettlementWithholdingNotification:
      type: object
      description: |
        This object will hold all information about GST Property Settlement Withholding Notification.

      properties:
        lodgedBy:
          type: string
          enum:
            - REPRESENTATIVE
          description: |
            Are you completing this form as a purchaser of the property or the purchaser's representative?
          example: REPRESENTATIVE

        contactDetails:
          $ref: "#/components/schemas/ContactDetails"

        properties: # field name
          type: array
          maxItems: 10
          minItems: 1
          description: |
            This will hold all the information of the property being purchased.  

            The property details should be listed in the contract you signed. Mandatory fields vary depending on the state or territory where you purchased the property.

            You can enter up to 10 properties in one lodgment, but this is only recommended where:
            - you have purchased multiple properties under the one contract
            - the properties are all settling on the same day

            If there are more than 10 properties to be entered on the form, you need to complete and lodge another set of forms.
          items:
            $ref: "#/components/schemas/Property"
        transaction:
          $ref: "#/components/schemas/TransactionWithholdingNotification"
        purchasers:
          type: array
          maxItems: 10
          minItems: 1
          description: |
            This will hold all information of the property purchasers.

            The purchaser details are the details of the entity purchasing the property. This can include details of an entity that is an individual, a company, a trust or another entity (for example, a superannuation fund). If there is more than one purchaser for this transaction then provide the details of each additional purchaser, ensuring the percentage of asset ownership is correct for each purchaser and doesn’t exceed 100%.

            If there are more than 10 purchasers, complete and lodge with details of 10 of the purchasers. Then phone us after 48 hours on 13 28 66 (Fast Key Code 3 4) to provide the additional purchaser details. You need to wait 48 hours after the form has been lodged so we can process it.

            We are authorised by the Taxation Administration Act 1953 to collect the TFN. It is not an offence to decline to quote a TFN.
          items:
            $ref: "#/components/schemas/Purchaser"
        suppliers:
          type: array
          maxItems: 10
          minItems: 1
          description: |
            You must notify us of the supplier who is required to report GST on this sale.

            Provide details of all suppliers.

            The supplier details you provide to us may be different to the supplier you contracted with. The supplier is the entity that is required to report the GST on this sale. For example, the supplier you contracted with may be part of a GST group (group member), whereas the supplier required to report the GST on this sale is the group representative.

            For partnerships – enter the name of the partnership. You don't need to list individual partner's names.

            If there is more than one supplier of the property, provide the details of each additional supplier, ensuring the proportion of withholding payment is correct for each supplier.

            If there are more than 10 suppliers, you must submit additional lodgments until you have included all suppliers.
          items:
            $ref: "#/components/schemas/Supplier"
        withholdingTotalAmount:
          type: integer
          minimum: 0
          maximum: 99999999999
          description: |
            Total withholding payment amount is a total amount of all the proportions of withholding payments
          example: 525000
        declaration:
          $ref: "#/components/schemas/DeclarationWithholdingNotification"
      additionalProperties: false
      required:
        - lodgedBy
        - contactDetails
        - properties
        - transaction
        - purchasers
        - suppliers
        - withholdingTotalAmount
        - declaration

    GSTPropertySettlementDateConfirmationRequest:
      description: This object will hold the data of the request payload of GST 
        Property Settlement Date Confirmation.
      type: object
      properties:
        data:
          $ref: '#/components/schemas/GSTPropertySettlementDateConfirmation'
    GSTPropertySettlementDateConfirmation:
      description: |
        This object will hold all information about GST Property Settlement Date Confirmation.

      type: object
      required:
        - prerequisiteCheckIndicator
        - lodgedBy
        - lodgmentChangedIndicator
        - contactDetails
        - transaction
        - declaration
      properties:
        prerequisiteCheckIndicator:
          description: "Have you completed the GST property settlement withholding
            notification form?"
          type: boolean
          example: true
        lodgedBy:
          type: string
          enum:
            - REPRESENTATIVE
          description: |
            Are you completing this form as a purchaser of the property or the purchaser's representative?
          example: REPRESENTATIVE
        lodgmentChangedIndicator:
          description: |
            Have the purchaser/supplier details changed since the GST withholding notification was lodged? 

            You must contact us to cancel the incorrect withholding notification and complete and submit another GST property settlement withholding notification before you can lodge this.
          type: boolean
          example: true

        contactDetails:
          $ref: '#/components/schemas/ContactDetails'
        transaction:
          $ref: '#/components/schemas/TransactionDateConfirmation'
        declaration:
          $ref: '#/components/schemas/DeclarationDateConfirmation'
    ContactDetails:
      type: object
      description: |
        This will hold all the contact information for the lodging entity who is lodging the form.

        You must provide contact details of the person completing the lodgment. This allows us to resolve any issues and process the form in a timely manner.
      properties:
        title:
          description: |
            Title of contact person
          type: string
          enum:
            - MR
            - MRS
            - MISS
            - MS
            - OTHER
          example: MR
        personName:
          $ref: "#/components/schemas/PersonName"
        representativeBusinessName:
          type: string
          description: |
            Representative's business name

            This is required for the purchaser's representative completing this lodgment.
          maxLength: 200
          pattern: ^[A-Za-z0-9 \-`!@%#\$&\(\)_=\[\]\{\}\\\|;:'",\.\?\/]+$
          example: "Precision Settlement Services"
        telephoneAreaCode:
          type: string
          description: |
            Telephone area code of the contact person
          maxLength: 4
          pattern: ^[0-9]+$
          example: "03"
        telephoneNumber:
          type: string
          description: |
            Telephone number of the contact person. Don't include brackets or spaces in your phone number.
          minLength: 7
          maxLength: 15
          pattern: ^[0-9]+$
          example: "12345678"
        emailCorrespondenceIndicator:
          type: boolean
          description: |
            Would you like ATO to communicate with you via email?

            By providing an email address, you are authorising the ATO to communicate with you by email about this form. If an email address is not provided, a confirmation email will not be sent.
          example: true
        electronicMailAddress:
          type: string
          description: |
            Email address of the contact person.

            The email address should comply with RFC 5322.

            If you provide your email address, we will email you a copy of the notification confirmation. 

            You should be aware that the internet is not a secure environment. The ATO does not control the path of inbound and outbound emails, so the privacy of personal information sent by unencrypted email cannot be guaranteed.
          minLength: 5
          maxLength: 100
          example: bob@example.com
        digitalSettlementServiceProvider:
          type: string
          maxLength: 200
          description: |
            This is the name of the digital platform or service provider used to complete the property settlement.
          pattern: ^[A-Za-z0-9 \-`!@%#\$&\(\)_=\[\]\{\}\\\|;:'",\.\?\/]+$
          example: "ABC Digital Service"
        digitalSettlementFileNumber:
          type: string
          maxLength: 200
          description: |
            This is the unique Workspace ID/number for the digital settlement file created in the Electronic Lodgment Network (ELN).
          example: "123456789"
      required:
        - title
        - personName
        - telephoneAreaCode
        - telephoneNumber
        - emailCorrespondenceIndicator
        - digitalSettlementServiceProvider
        - representativeBusinessName

    Property:
      description: |
        This will hold all information of a property
      type: object
      properties:
        propertyType:
          type: string
          description: |
            Property Type
          enum:
            - UNIT
            - HOUSE
            - LAND
          example: HOUSE

        address:
          allOf:
            - $ref: "#/components/schemas/Address"
            - type: object
              properties:
                countryCode:
                  description: Country Code must be AU because the purchase 
                    relates to an Australian property.
                  type: string
                  default: 'AU'
                  enum: ['AU']
                  example: 'AU'

              required:
                - countryCode
        lot:
          type: string
          maxLength: 50
          description: |
            Lot
          pattern: ^[A-Za-z0-9&'\/\-\(\) ]+$
          example: "123"
        block:
          type: string
          maxLength: 50
          description: |
            Section or block
          pattern: ^[A-Za-z0-9&'\/\-\(\) ]+$
          example: "B"
        plan:
          type: string
          maxLength: 50
          description: |
            Plan
          pattern: ^[A-Za-z0-9&'\/\-\(\) ]+$
          example: "PS123456"
        planType:
          type: string
          maxLength: 11
          description: |
            Plan Type
          pattern: ^[A-Za-z0-9&'\/\-\(\) ]+$
          example: "PS"
        volume:
          type: string
          maxLength: 15
          description: |
            Volume
          pattern: ^[A-Za-z0-9&'\/\-\(\) ]+$
          example: "12345"
        folio:
          type: string
          maxLength: 50
          description: |
            Folio
          pattern: ^[A-Za-z0-9&'\/\-\(\) ]+$
          example: "12345"
      required:
        - propertyType
        - address

    TransactionWithholdingNotification:
      type: object
      description: |
        This will hold all information of the property purchase transaction.

        Refer to the contract of sale for details to assist in completing this section.
      properties:
        contractDate:
          type: string
          format: date
          description: |
            This is the contract date (YYYY-MM-DD) of the property purchase.
          example: "2026-01-25"
        expectedSettlementDate:
          type: string
          format: date
          description: |
            This is the expected settlement date (YYYY-MM-DD) for the property purchase.
          example: "2027-02-12"
        contractPrice:
          type: integer
          minimum: 0
          maximum: 99999999999
          description: |
            This is the contract price including GST.

            The contract price is the GST-inclusive price of the supply as listed in the contract. The contract price may be varied by the parties before settlement. Normal settlement day adjustments can be disregarded (for example, adjustments to reflect apportionment of council rates or water rates).

            If, however, the contract includes non-monetary consideration (for example, land swaps) the contract price is the sum of the monetary consideration (including GST) plus the GST inclusive market value of the non-monetary consideration.
          example: 500000
      required:
        - contractDate
        - expectedSettlementDate
        - contractPrice

    TransactionDateConfirmation:
      description: "When you submitted the GST property settlement withholding notification,
        you were provided with a payment reference number (PRN) and a lodgment reference
        number (LRN). Use both reference numbers in order for us to correctly match
        the details."
      type: object
      required:
        - lodgmentReferenceNumber
        - paymentReferenceNumber
        - actualSettlementDate
      properties:
        lodgmentReferenceNumber:
          description: |
            You can find the Lodgment Reference Number (LRN) from either:

            - the email we issued to you when you lodged a GST Property Settlement Withholding Notification.
            - the receipt in the API response header returned when you submit the withholding notification using the ATO GST Property Settlement Withholding Notification API.
          type: string
          minLength: 13
          maxLength: 13
          pattern: ^[0-9]+$
          example: "1234567890123"
        paymentReferenceNumber:
          description: |
            You can find the payment reference number (PRN) on either:

              - the email we issued to you when you lodged a GST Property Settlement Withholding Notification.
              - the API response returned when you submit the withholding notification using ATO GST Property Settlement Withholding Notification API
          type: string
          maxLength: 18
          pattern: ^[0-9]+$
          example: "123456789012345678"
        actualSettlementDate:
          description: "The settlement date is the date of settlement for the sale.
            If it is an instalment contract, it is the date you pay the first instalment
            (not the date you paid the deposit)."
          type: string
          format: date
          example: "2025-06-30"

    Purchaser:
      type: object
      description: |
        This will hold all information of a property purchaser.
      properties:
        entityType:
          type: string
          enum:
            - INDIVIDUAL
            - NON-INDIVIDUAL
          description: |
            This is the Entity Type of the purchaser who can be an individual or non-individual like a company, a trust or another entity (for example, a superannuation fund).
          example: INDIVIDUAL
        entityName:
          type: string
          description: |
            If the purchaser is a non-individual entity, provide the Purchaser Entity Name.
          pattern: ^[A-Za-z0-9 \-`!@%#\$&\(\)_=\[\]\{\}\\\|;:'",\.\?\/]+$
          example: "Example Property Investments Pty Ltd"
        purchaserName:
          $ref: "#/components/schemas/PurchaserName"
        birthDate:
          $ref: "#/components/schemas/BirthDate"
        australianBusinessNumber:
          type: string
          minLength: 8
          maxLength: 11
          description: |
            This is the purchaser's Australian Business Number.

            You're not required to provide your Australian business number (ABN) or tax file number (TFN) but providing them helps us identify you in our records. This means we can process your lodgment faster.
          pattern: ^[0-9]+$
          example: "64128942571"
        taxFileNumber:
          type: string
          minLength: 8
          maxLength: 9
          description: |
            This is the purchaser's Tax Reference Number.

            You're not required to provide your Australian business number (ABN) or tax file number (TFN) but providing them helps us identify you in our records. This means we can process your lodgment faster.
          pattern: ^[0-9]+$
          example: "068922122"
        telephoneAreaCode:
          type: string
          minLength: 1
          maxLength: 4
          description: |
            This is the purchaser's telephone area code.
          pattern: ^[0-9]+$
          example: "03"
        telephoneNumber:
          type: string
          minLength: 7
          maxLength: 15
          description: |
            This is the purchaser's telephone number. Don't include brackets or spaces in your phone number.
          pattern: ^[0-9]+$
          example: "34567890"

        

        address:
          allOf:
            - $ref: "#/components/schemas/Address"
            - type: object
              properties:
                countryCode:
                  description: |
                    Country code

                    This represents the Country Code as prescribed by AS4590 and inherited from ISO 3166.
                  type: string
                  enum: ['AD', 'AE', 'AF', 'AG', 'AI', 'AL', 'AM', 'AN', 'AO', 'AQ',
                    'AR', 'AS', 'AT', 'AU', 'AW', 'AX', 'AZ', 'BA', 'BB', 'BD', 'BE',
                    'BF', 'BG', 'BH', 'BI', 'BJ', 'BL', 'BM', 'BN', 'BO', 'BQ', 'BR',
                    'BS', 'BT', 'BV', 'BW', 'BY', 'BZ', 'CA', 'CC', 'CF', 'CG', 'CH',
                    'CI', 'CK', 'CL', 'CM', 'CN', 'CO', 'CR', 'CU', 'CV', 'CW', 'CX',
                    'CY', 'CZ', 'DE', 'DJ', 'DK', 'DM', 'DO', 'DZ', 'EC', 'EE', 'EG',
                    'EH', 'ER', 'ES', 'ET', 'FI', 'FJ', 'FK', 'FM', 'FO', 'FR', 'GA',
                    'GB', 'GD', 'GE', 'GF', 'GG', 'GH', 'GI', 'GL', 'GM', 'GN', 'GP',
                    'GQ', 'GR', 'GS', 'GT', 'GU', 'GW', 'GY', 'HK', 'HM', 'HN', 'HR',
                    'HT', 'HU', 'ID', 'IE', 'IL', 'IM', 'IN', 'IO', 'IQ', 'IR', 'IS',
                    'IT', 'JE', 'JM', 'JO', 'JP', 'KE', 'KG', 'KH', 'KI', 'KM', 'KN',
                    'KP', 'KR', 'KW', 'KY', 'KZ', 'LA', 'LB', 'LC', 'LI', 'LK', 'LR',
                    'LS', 'LT', 'LU', 'LV', 'LY', 'MA', 'MC', 'MD', 'ME', 'MF', 'MG',
                    'MH', 'MK', 'ML', 'MM', 'MN', 'MO', 'MP', 'MQ', 'MR', 'MS', 'MT',
                    'MU', 'MV', 'MW', 'MX', 'MY', 'MZ', 'NA', 'NC', 'NE', 'NF', 'NG',
