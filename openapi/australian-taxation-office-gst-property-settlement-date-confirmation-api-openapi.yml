        errors:
          items:
            $ref: '#/components/schemas/ApiError'
          type: array
    TransactionDateConfirmation:
      description: When you submitted the GST property settlement withholding notification, you were provided with a payment reference number (PRN) and a lodgment reference number (LRN). Use both reference numbers in order for us to correctly match the details.
      type: object
      required:
      - lodgmentReferenceNumber
      - paymentReferenceNumber
      - actualSettlementDate
      properties:
        lodgmentReferenceNumber:
          description: 'You can find the Lodgment Reference Number (LRN) from either:


            - the email we issued to you when you lodged a GST Property Settlement Withholding Notification.

            - the receipt in the API response header returned when you submit the withholding notification using the ATO GST Property Settlement Withholding Notification API.

            '
          type: string
          minLength: 13
          maxLength: 13
          pattern: ^[0-9]+$
          example: '1234567890123'
        paymentReferenceNumber:
          description: "You can find the payment reference number (PRN) on either:\n\n  - the email we issued to you when you lodged a GST Property Settlement Withholding Notification.\n  - the API response returned when you submit the withholding notification using ATO GST Property Settlement Withholding Notification API\n"
          type: string
          maxLength: 18
          pattern: ^[0-9]+$
          example: '123456789012345678'
        actualSettlementDate:
          description: The settlement date is the date of settlement for the sale. If it is an instalment contract, it is the date you pay the first instalment (not the date you paid the deposit).
          type: string
          format: date
          example: '2025-06-30'
    GSTPropertySettlementDateConfirmation:
      description: 'This object will hold all information about GST Property Settlement Date Confirmation.

        '
      type: object
      required:
      - prerequisiteCheckIndicator
      - lodgedBy
      - lodgmentChangedIndicator
      - contactDetails
      - transaction
      - declaration
      properties:
        prerequisiteCheckIndicator:
          description: Have you completed the GST property settlement withholding notification form?
          type: boolean
          example: true
        lodgedBy:
          type: string
          enum:
          - REPRESENTATIVE
          description: 'Are you completing this form as a purchaser of the property or the purchaser''s representative?

            '
          example: REPRESENTATIVE
        lodgmentChangedIndicator:
          description: "Have the purchaser/supplier details changed since the GST withholding notification was lodged? \n\nYou must contact us to cancel the incorrect withholding notification and complete and submit another GST property settlement withholding notification before you can lodge this.\n"
          type: boolean
          example: true
        contactDetails:
          $ref: '#/components/schemas/ContactDetails'
        transaction:
          $ref: '#/components/schemas/TransactionDateConfirmation'
        declaration:
          $ref: '#/components/schemas/DeclarationDateConfirmation'
    ContactDetails:
      type: object
      description: 'This will hold all the contact information for the lodging entity who is lodging the form.


        You must provide contact details of the person completing the lodgment. This allows us to resolve any issues and process the form in a timely manner.

        '
      properties:
        title:
          description: 'Title of contact person

            '
          type: string
          enum:
          - MR
          - MRS
          - MISS
          - MS
          - OTHER
          example: MR
        personName:
          $ref: '#/components/schemas/PersonName'
        representativeBusinessName:
          type: string
          description: 'Representative''s business name


            This is required for the purchaser''s representative completing this lodgment.

            '
          maxLength: 200
          pattern: ^[A-Za-z0-9 \-`!@%#\$&\(\)_=\[\]\{\}\\\|;:'",\.\?\/]+$
          example: Precision Settlement Services
        telephoneAreaCode:
          type: string
          description: 'Telephone area code of the contact person

            '
          maxLength: 4
          pattern: ^[0-9]+$
          example: '03'
        telephoneNumber:
          type: string
          description: 'Telephone number of the contact person. Don''t include brackets or spaces in your phone number.

            '
          minLength: 7
          maxLength: 15
          pattern: ^[0-9]+$
          example: '12345678'
        emailCorrespondenceIndicator:
          type: boolean
          description: 'Would you like ATO to communicate with you via email?


            By providing an email address, you are authorising the ATO to communicate with you by email about this form. If an email address is not provided, a confirmation email will not be sent.

            '
          example: true
        electronicMailAddress:
          type: string
          description: "Email address of the contact person.\n\nThe email address should comply with RFC 5322.\n\nIf you provide your email address, we will email you a copy of the notification confirmation. \n\nYou should be aware that the internet is not a secure environment. The ATO does not control the path of inbound and outbound emails, so the privacy of personal information sent by unencrypted email cannot be guaranteed.\n"
          minLength: 5
          maxLength: 100
          example: bob@example.com
        digitalSettlementServiceProvider:
          type: string
          maxLength: 200
          description: 'This is the name of the digital platform or service provider used to complete the property settlement.

            '
          pattern: ^[A-Za-z0-9 \-`!@%#\$&\(\)_=\[\]\{\}\\\|;:'",\.\?\/]+$
          example: ABC Digital Service
        digitalSettlementFileNumber:
          type: string
          maxLength: 200
          description: 'This is the unique Workspace ID/number for the digital settlement file created in the Electronic Lodgment Network (ELN).

            '
          example: '123456789'
      required:
      - title
      - personName
      - telephoneAreaCode
      - telephoneNumber
      - emailCorrespondenceIndicator
      - digitalSettlementServiceProvider
      - representativeBusinessName
