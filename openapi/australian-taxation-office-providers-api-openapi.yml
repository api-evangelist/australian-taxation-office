openapi: 3.2.0
info:
  title: Australian Taxation Office Providers API
  version: 1.0.67
  x-status:
    status: Active
  description: 'Operations tagged Providers across 2 of this provider''s published API definitions: dsg-smsfaliaslookup-v1-prod_0_0.yaml, australian-taxation-office-smsf-alias-lookup-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{env}/dsg-smsfaliaslookup/v1
  description: Production Environment
  variables:
    env:
      default: api.ato.gov.au
      enum:
      - api.ato.gov.au
      - sandbox.api.ato.gov.au
tags:
- name: Providers
  description: This endpoint returns a list of SMSF messaging providers
paths:
  /providers:
    get:
      tags:
      - Providers
      summary: provide list of SMSF messaging providers
      description: This resource returns a list of SMSF messaging providers
      operationId: GetProviders
      responses:
        200:
          description: ''
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/ProviderListResponse'
              examples:
                successful:
                  $ref: '#/components/examples/ProviderListResponse'
    servers:
    - url: https://{env}/dsg-smsfaliaslookup/v1
      description: Production Environment
      variables:
        env:
          default: api.ato.gov.au
          enum:
          - api.ato.gov.au
          - sandbox.api.ato.gov.au
components:
  schemas:
    GatewayResponse:
      description: List of Gateway details
      properties:
        organisationalName:
          type: string
        startDate:
          type: string
        endDate:
          type: string
        electronicServiceAddressAlias:
          type: string
        electronicServiceAddress:
          type: string
        electronicContact:
          $ref: '#/components/schemas/ElectronicContact'
      required:
      - electronicServiceAddressAlias
      - electronicServiceAddress
      - startDate
      - endDate
      - organisationalName
      - electronicContact
    ProviderListResponse:
      description: The list of SMSF  alias providers
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/Provider'
    ElectronicContact:
      description: gateway contact details
      type: object
      properties:
        telephoneAreaCode:
          type:
          - string
          - 'null'
        telephoneNumber:
          type:
          - string
          - 'null'
        emailAddress:
          type: string
        webUniformResourceLocator:
          type: string
    ProviderResponse:
      description: List of Provider details
      properties:
        organisationalName:
          type: string
        electronicContact:
          $ref: '#/components/schemas/ElectronicContact'
      required:
      - organisationalName
      - electronicContact
    Provider:
      description: Alias provider details
      type: object
      properties:
        gateway:
          $ref: '#/components/schemas/GatewayResponse'
        provider:
          $ref: '#/components/schemas/ProviderResponse'
        certifications:
          type: array
          items:
            type: string
      required:
      - electronicServiceAddressAlias
      - electronicServiceAddress
      - startDate
      - endDate
      - organisationalName
      - contactDetails
  examples:
    ProviderListResponse:
      summary: Example Provider Response
      description: Example provider response yaml
