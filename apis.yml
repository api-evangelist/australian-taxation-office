aid: australian-taxation-office

name: Australian Taxation Office

description: The Australian Taxation Office (ATO) is the Australian Government's principal revenue collection agency, administering the tax and
  superannuation systems. Through the ATO API Portal (apiportal.ato.gov.au) it gives digital service providers (DSPs) an API product catalogue
  with documentation and subscriptions, listing APIs such as SMSF Alias Lookup, the Digital Services Gateway Health Check, Stapled Super Fund,
  OAuth Dynamic Client Registration, Global and Domestic Minimum Tax lodgment and the GST Property Settlement Service.

